name: Static Checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pixi
        env:
          # Pin: an unpinned "latest" install silently broke this workflow
          # when a pixi release started validating every environment's lock
          # entry (including path deps like RLOpt/ImitationLearningTools,
          # which this checkout doesn't fetch) before running a task for
          # any single environment. Bump deliberately after verifying with
          # --frozen locally.
          PIXI_VERSION: "0.75.0"
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh

      - name: Lint owned Python surfaces
        run: |
          # --frozen: install strictly from the committed pixi.lock instead
          # of validating/re-solving every environment in pixi.toml. Needed
          # because submodules (RLOpt, ImitationLearningTools, IsaacLab)
          # aren't checked out here and the `static` environment doesn't
          # need them.
          "$HOME/.pixi/bin/pixi" run --frozen -e static lint-owned

      - name: Byte-compile owned Python surfaces
        run: |
          "$HOME/.pixi/bin/pixi" run --frozen -e static compile-owned
