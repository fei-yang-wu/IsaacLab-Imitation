# Continue both SONIC-reset leaders from 20B to 30B, unchanged recipe.
#
# The 20B rows closed most of the SR gap to released SONIC and were still
# improving when the budget ended:
#   ln_hold1_sonicreset     20B: 0.9558 SR / 22.15 mm  (10B base: 0.9368 / 22.86)
#   fsq64_hold10_sonicreset 20B: 0.9468 SR / 24.57 mm  (10B base: 0.9197 / 24.93)
#   released SONIC               0.9937 SR / 28.65 mm
# This campaign buys another 10B under the identical regime (selection=sonic,
# adaptive_uniform_ratio pinned at 0.1 -- the landing ramp completed inside
# the 20B chain's segment 5) to see whether the SR curve keeps climbing toward
# SONIC's. NOTHING changes but the budget, so 20B-vs-30B is a clean budget
# axis; the reset-vs-frames confound of the 20B continuation stays as it was.
#
# Resume: segment 9 loads the newest checkpoint in the 20B arm's tracker tree.
# Those checkpoints CARRY cumulative_env_frames (post-2026-08-16 RLOpt), so no
# initial_frame_offset is needed anywhere -- the budget continues from
# 20,000,145,408 and stops at 30B wherever the walltime lands.
#
# Three chained segments: the last 10B took ~22 h (one full 16 h segment plus
# ~6 h), so segment 11 is insurance and normally exits at zero iterations.
#
# W&B: these stages append to the SAME runs the 20B chain wrote
# (`ln-hold1-sonicreset-s0-r1`, `fsq64-hold10-sonicreset-s0-r1`, group
# sonic-reset-20b). That chain predates the per-chain run-id state file, so it
# used its declared ids verbatim; submit.sh seeds
# <output_root>/wandb_run_id with the same verbatim id BEFORE the first job,
# otherwise the control plane would mint a new token and split the curve.
# The runs were created in shared mode and a chain never changes mode
# mid-flight, so WANDB_MODE=shared stays -- read the `env_frames` metric as
# the x-axis, never `_step`.
name: sonic-reset-30b
profile: ice
wandb_project: g1-bones-seed
wandb_group: sonic-reset-20b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  stride: 1
  z_dim: 256
  command_dim: ${vars.z_dim}
  phase_mode: sin_cos
  anchor_mode: robot_heading
  hold: 1
  train_num_envs: 16384
  rollout_steps: 24
  # The GLOBAL budget: another 10B on top of the 20B already trained.
  frame_cap: 30000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}
  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  # New tree; the 20B tree stays read-only so its scoreboard rows remain
  # reproducible.
  output_root: /data/sonic_reset_30b/${vars.arm}_seed${vars.seed}
  # The finished 20B arm this one continues, and the ORIGINAL 10B base arm
  # whose frozen encoder both chains share (binding unchanged end to end).
  base_arm: ${vars.arm}
  prev_root: /data/sonic_reset_20b/${vars.arm}_seed${vars.seed}
  encoder_root: /data/bottleneck_10b/${vars.base_arm}_seed${vars.seed}

  # The landing ramp is DONE; every segment pins SONIC's release value.
  reset_hold_args:
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.1
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=null

  seg9_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.prev_root}/tracker
  seg10_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker
  seg11_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"
    - "env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=sonic-reset-20b
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_root}/encoder/checkpoints/latest.pt
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=z
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.z_dim}

  # Byte-identical to the 20B campaign's recipe, selection included.
  tuned_lowlevel:
    - env.rewards.action_rate_l2.weight=0.0
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.command_interface.reference.selection=sonic
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - "agent.policy.num_cells=[2048,2048,1024,1024,512,512]"
    - "agent.value_function.num_cells=[2048,2048,1024,1024,512,512]"
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  dyn_args: [agent.ipmd.hl_skill_finetune_enabled=false]

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
    # Fails loudly if the 20B artifacts or the shared frozen encoder are
    # missing rather than silently restarting from an older checkpoint.
    - /data/sonic_reset_20b/${vars.arm}_seed${vars.seed}/tracker
    - /data/bottleneck_10b/${vars.base_arm}_seed${vars.seed}/encoder/checkpoints/latest.pt
  output_container_path: /data/sonic_reset_30b/${vars.arm}_seed${vars.seed}

arms:
  # CONTINUOUS leader. 20B: 0.9558 SR / 22.15 mm.
  ln_hold1_sonicreset:
    vars:
      base_arm: cont_det_ln_hold1
      z_dim: 256
      command_dim: 258
      hold: 1
    stages: &continuation_stages
      - name: lowlevel9
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.dyn_args},${vars.reset_hold_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg9_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,sonic-reset-30b,${vars.arm},seed${vars.seed},lowlevel,segment9
          WANDB_RUN_ID: ${vars.wandb_arm}-s${vars.seed}-r1
          WANDB_RESUME: allow
          WANDB_MODE: shared
          WANDB__PRIMARY: "true"
          WANDB__LABEL: trainer
      - name: lowlevel10
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.dyn_args},${vars.reset_hold_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg10_args}}
        depends_on: lowlevel9
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,sonic-reset-30b,${vars.arm},seed${vars.seed},lowlevel,segment10
          WANDB_RUN_ID: ${vars.wandb_arm}-s${vars.seed}-r1
          WANDB_RESUME: allow
          WANDB_MODE: shared
          WANDB__PRIMARY: "true"
          WANDB__LABEL: trainer
      - name: lowlevel11
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.dyn_args},${vars.reset_hold_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg11_args}}
        depends_on: lowlevel10
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,sonic-reset-30b,${vars.arm},seed${vars.seed},lowlevel,segment11
          WANDB_RUN_ID: ${vars.wandb_arm}-s${vars.seed}-r1
          WANDB_RESUME: allow
          WANDB_MODE: shared
          WANDB__PRIMARY: "true"
          WANDB__LABEL: trainer
  # DISCRETE, planner-facing token space. 20B: 0.9468 SR / 24.57 mm.
  fsq64_hold10_sonicreset:
    vars:
      base_arm: fsq64_hold10
      z_dim: 64
      command_dim: 66
      hold: 10
    stages: *continuation_stages
