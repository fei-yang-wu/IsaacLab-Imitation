# One arm: the 2026-08-15 leader (`cont_det_ln_hold1`) retrained with joint
# velocities back in the skill-encoder input (`full_body`, 670-wide, vs the
# base row's `root_qpos`, 380-wide). Every training value is byte-identical to
# `2026-08-15-latent-bottleneck-10b`; only `expert_macro_state_terms` moves.
#
# No pretrain stage and no auto-segment chain, by explicit user decision
# (2026-08-18): the encoder was pretrained locally (50k updates, verified
# 670-wide input layer) and is uploaded to /data; the lowlevel runs as ONE job
# carrying the full 10B budget. When the 16h ICE walltime ends it early, the
# SIGTERM checkpoint lands in the tracker tree and a manual relaunch of the
# `lowlevel_resume` stage continues the same budget through
# `cumulative_env_frames`. Never shrink max_iterations to fit the walltime.
name: qvel-fullbody-leader
profile: ice
wandb_project: g1-bones-seed
wandb_group: latent-bottleneck-10b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  stride: 1
  z_dim: 256
  command_dim: 258
  phase_mode: sin_cos
  anchor_mode: robot_heading
  hold: 1
  train_num_envs: 16384
  rollout_steps: 24
  frame_cap: 10000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}
  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/qvel_fullbody_10b/${vars.arm}_seed${vars.seed}
  # Pretrained LOCALLY (2026-08-18) and uploaded; preflight requires it.
  encoder_checkpoint: ${vars.output_root}/encoder/checkpoints/latest.pt

  # The one variable: full_body macro state (29 qpos + 29 qvel + 9 root).
  macro_terms: "[expert_motion,expert_anchor_pos_b,expert_anchor_ori_b]"

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=latent-bottleneck-10b
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_checkpoint}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=z
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.z_dim}

  tuned_lowlevel:
    - env.rewards.action_rate_l2.weight=0.0
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.command_interface.reference.selection=random80_adaptive20
    - env.data.reference_prefetch_mode=next_and_reset

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - "agent.policy.num_cells=[2048,2048,1024,1024,512,512]"
    - "agent.value_function.num_cells=[2048,2048,1024,1024,512,512]"
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  first_args: []
  resume_args:
    # The termination curriculum (5M -> 30M) completes inside the first
    # submission; a resume pins the strict post-anneal terminations.
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
    - ${vars.encoder_checkpoint}
  output_container_path: /data/qvel_fullbody_10b/${vars.arm}_seed${vars.seed}

arms:
  cont_det_ln_hold1_fullbody:
    vars: {}
    stages: &fullbody_stages
      # First submission: fresh start, curriculum on.
      - name: lowlevel
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.first_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,qvel-fullbody,${vars.arm},seed${vars.seed},lowlevel
          WANDB_RUN_ID: ${vars.wandb_arm}-s${vars.seed}
          WANDB_RESUME: allow
          # No WANDB_MODE=shared: the EC/MuJoCo sidecar publishes to its own
          # companion run in this group (retired 2026-08-18). Shared mode had
          # to be set at run creation, could never be added afterwards, and
          # refused asynchronously -- a sidecar aimed at a non-shared run
          # dropped every point while looking healthy (job 5580308). It also
          # made the trainer's wandb.log(step=...) a no-op.
      # Manual relaunch until cumulative_env_frames reaches 10B. Submit with
      # --only-stage lowlevel_resume; never in the same plan as `lowlevel`.
      - name: lowlevel_resume
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.resume_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,qvel-fullbody,${vars.arm},seed${vars.seed},lowlevel,resume
          WANDB_RUN_ID: ${vars.wandb_arm}-s${vars.seed}
          WANDB_RESUME: allow

  # Batch-scale variant: 20,480 envs = 4096*5 (frames/batch 491,520,
  # iterations 20,346 for the same 10B). Two variables against the
  # base-campaign leader (qvel AND batch); one variable (batch) against
  # cont_det_ln_hold1_fullbody. Reuses that arm's uploaded encoder file, so
  # the skill-checkpoint binding is identical by construction.
  # History: 24,576 envs OOM'd the H200 at the Newton graph launch
  # (job 5580202); 16,384 sits at ~64% VRAM, so 20,480 is the middle step.
  cont_det_ln_hold1_fullbody_env20k:
    vars:
      # RLOpt adds a `logdir:<19-char timestamp>_wandb-<run id>` W&B tag;
      # W&B caps tags at 64 chars, so the run id must stay <= 31 chars.
      # The default dashed arm name overflowed it (job 5580199).
      wandb_arm: cont-det-ln-fb20k-r2
      train_num_envs: 20480
      encoder_checkpoint: /data/qvel_fullbody_10b/cont_det_ln_hold1_fullbody_seed0/encoder/checkpoints/latest.pt
    stages: *fullbody_stages
