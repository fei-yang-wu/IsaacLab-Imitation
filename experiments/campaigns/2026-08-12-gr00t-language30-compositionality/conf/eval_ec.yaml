# EC (Embodied-Control) MuJoCo evaluation of the 30-motion arms.
#
# Deployment-rehearsal signal, NOT the number of record — MuJoCo actuator
# dynamics differ from Newton by design. The Isaac grid is the record.
#
# `batched_goals` runs every goal in ONE process per variant via the job's
# `goal_sequence`, so the 1.3B head loads once instead of once per goal.
ec_repo: external/Embodied-Control
pixi_bin: /home/fwu91/Storage/.pixi/bin/pixi
mjcf: source/isaaclab_imitation/isaaclab_imitation/assets/unitree/g1_description/g1_29dof_rev_1_0.xml
goal_features: outputs/gr00t_language30/goal_features/goal_features.pt
reference_arrays: data/bones_seed_language30_compositionality_v1/reference_arrays/root_qpos_v1
output_root: logs/gr00t_language30_ec_eval/grid_v1

batched_goals: true
only_arms: null
record_states: true # per-tick states, so MPJPE can be computed post-hoc
compute_mpjpe: false # batched runs need per-episode motions; see eval_mpjpe
hold_steps: 10
slots: 3
rtc_freeze_steps: 0
rtc_variants: [false]
episodes: 1 # overridden by the goal count in batched mode
max_steps: 500
seed: 0
min_base_height_m: 0.4 # matches the env's base_too_low: survival = did not fall
cell_timeout_s: 5400

# Manifest order, matching the Isaac grid's per-environment goal assignment.
goals:
  - Neutral_stoop_down_001_A057
  - big_heavy_one_hand_front_high_to_front_low_R_001_A524
  - big_heavy_one_hand_front_low_to_front_high_R_001_A524
  - big_light_two_hands_put_down_right_side_high_R_001_A520
  - casual_greeting_R_001_A428
