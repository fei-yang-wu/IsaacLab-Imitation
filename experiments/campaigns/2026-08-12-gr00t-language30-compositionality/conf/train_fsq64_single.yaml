defaults:
  - base_train
  - _self_

# Phase 4: one motion (lift_crate_walk), rollout data, fsq64 latent target.
# Removes language disambiguation and multi-motion interference, so whatever
# error remains is the state-to-latent regression itself.
output_dir: outputs/gr00t_language30/arms/fsq64_single
target: latent
data:
  table: outputs/gr00t_language30/tables/fsq64_single_table.pt
  state_field: oracle_rollout_state_history
goal_features: outputs/gr00t_language30/goal_features/goal_features.pt
pretrained_bundle: outputs/gr00t_language10/goal_features/action_head_trunk.pt
model:
  # No language to disambiguate with one goal, so the dropout that exists to
  # force language reliance is pure input noise here.
  state_dropout_prob: 0
run:
  checkpoint_interval: 12000
wandb:
  name: l30_fsq64_single
  tags: [gr00t-head, language30, single-motion, fsq64, target-latent, ablation]
  group: gr00t-language30-compositionality
