# Which encoder makes the best tracker? Nine encoders, one tracker recipe.
#
# Tier C of the endpoint-collapse investigation
# (`experiments/campaigns/2026-08-29-endpoint-collapse-probe/`). That campaign
# measured what the PRETRAIN objective demands of the encoder window and found
# it demands very little: at horizon 10 an encoder seeing two window slots
# matched or beat one seeing nine. Pretrain eval loss is not the thing we ship,
# so this campaign asks the deployable version of the question -- train a
# tracker on each encoder and compare tracking.
#
# Every arm matches the `smooth-ablation-5b` base recipe except the encoder it
# binds, the horizon that encoder was trained at, and the parallel environment
# count. Hold 1, 256-D code, 258-wide command, frozen encoder, 12,288 envs x 24.
#
# HARDWARE. The stage asks for an H100 rather than the base recipe's H200
# (2026-08-30): ICE had free H100 nodes while every arm sat PENDING on H200
# resources. The environment count drops from 20,480 to 12,288 to stay inside
# H100 memory, which moves `frames_per_batch` to 294,912 and the minibatch to
# 221,184 but holds the 500M frame budget. All nine arms moved together, so
# the encoder comparison stays single-variable; the `prod` arm is no longer an
# exact recipe match for the 5B and 50B history.
#
# Arm families:
#   prod                  the round-4 `diffntp_chunk_h1_ee_wide` encoder every
#                         current tracker binds; bridges to the 5B/50B history
#   suffix1/2/5/9         horizon 10, encoder sees only the last N window slots
#   h1/h2/h5/h10          the horizon itself shrinks, so encoder input and both
#                         pretrain targets move together
#
# `prod`, `suffix9` and `h10` are the SAME encoder configuration trained three
# times independently. Their spread is this campaign's encoder-initialization
# noise floor, and no difference smaller than that spread is a result.
#
# `h1` is degenerate by construction: horizon 1 has no intermediate window, so
# its encoder used `window_mode=full` and its single visible frame IS the
# endpoint target. Its code can carry the answer, which makes it a ceiling
# reference, not a point on the horizon curve.
#
# BUDGET CAVEAT. 500M frames is a screen. The production regime is 5B and the
# milestone curve for this recipe is flat only past roughly 3-4B, so an
# ordering here is a hypothesis about the 5B ordering, not a measurement of it.
# The 2026-08-20 interface design study already showed a short budget inventing
# a "64-D hold-1 dead zone" that a longer budget erased. Do not promote an arm
# on this campaign alone.
#
# The failure-share ramp runs 0.8 -> 0.2 over the first 1B, so at 500M every
# arm stops mid-ramp at roughly 0.5. That is identical across arms and keeps
# the recipe byte-matched to production; it is not the converged selection
# regime.
name: encoder-interface-500m
profile: ice
wandb_project: g1-bones-seed
# Confirmed with the user on 2026-08-30.
wandb_group: encoder-interface-500m

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  wandb_id: ei500-arm
  submit_seed: 0

  z_dim: 256
  command_dim: 258
  code_latent_dim: 256
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  phase_source: hold
  phase_period: 0
  command_mode: z
  finetune_args: ["agent.ipmd.hl_skill_finetune_enabled=false"]

  # Per-arm. `skill_horizon` MUST equal the bound checkpoint's horizon_steps:
  # FrozenHighLevelSkillCommandSampler hard-fails on a mismatch rather than
  # feeding the encoder a wrong-width window.
  encoder_ckpt: /data/endpoint_collapse_probe/${vars.encoder_arm}_seed0/encoder/checkpoints/latest.pt
  encoder_arm: h10
  skill_horizon: "10"
  encoder_source: pretrained

  train_num_envs: 12288
  rollout_steps: 24
  frame_cap: 500000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/encoder_interface_500m/${vars.arm}_seed${vars.seed}

  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03

  select_ramp:
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.8
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=0.2
    - env.command_interface.reference.selection.adaptive_ratio_ramp_frames=1000000000

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=encoder-interface-500m
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=${vars.skill_horizon}
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.command_phase_source=${vars.phase_source}
    - agent.ipmd.latent_learning.command_phase_period=${vars.phase_period}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=100000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - "agent.policy.num_cells=[2048,2048,1024,1024,512,512]"
    - "agent.value_function.num_cells=[2048,2048,1024,1024,512,512]"
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"
    - "env.expert_macro_state_terms=${vars.macro_terms}"
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
    - ${vars.encoder_ckpt}
  output_container_path: ${vars.output_root}

arms:
  # ---- Reference row -----------------------------------------------------
  prod:
    vars:
      wandb_id: ei500-prod
      skill_horizon: "10"
      encoder_ckpt: /data/pareto_stack/diffntp_chunk_h1_ee_wide_seed0/encoder/checkpoints/latest.pt
    stages: &tracker_stage
      - name: lowlevel
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.finetune_args},${vars.reward_args},${vars.select_ramp},${vars.lowlevel_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h100:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,encoder-interface-500m,${vars.arm},seed${vars.seed},lowlevel
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # ---- Suffix family: horizon 10, encoder sees only the last N slots ------
  suffix1:
    vars:
      wandb_id: ei500-sfx1
      encoder_arm: suffix1
      skill_horizon: "10"
    stages: *tracker_stage

  suffix2:
    vars:
      wandb_id: ei500-sfx2
      encoder_arm: suffix2
      skill_horizon: "10"
    stages: *tracker_stage

  suffix5:
    vars:
      wandb_id: ei500-sfx5
      encoder_arm: suffix5
      skill_horizon: "10"
    stages: *tracker_stage

  suffix9:
    vars:
      wandb_id: ei500-sfx9
      encoder_arm: suffix9
      skill_horizon: "10"
    stages: *tracker_stage

  # ---- Horizon family: input and both pretrain targets shrink together ----
  #
  # PARTITION. The horizon arms run on `coe-gpu` with the `coe-grade` QoS
  # rather than the `ice-gpu` / `coe-ice` pair the suffix arms used
  # (2026-08-30): every H100 in `ice-gpu` was allocated while `coe-gpu` held
  # free ones. Same H100 hardware and same recipe, but `coe-gpu` runs
  # `PreemptMode=REQUEUE`, so one of these arms can be requeued and restart
  # from its last checkpoint. Record a requeue in the README if it happens.
  h1:
    vars:
      wandb_id: ei500-h1
      encoder_arm: h1
      skill_horizon: "1"
    stages: &tracker_stage_coe
      - name: lowlevel
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.finetune_args},${vars.reward_args},${vars.select_ramp},${vars.lowlevel_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h100:1
        cpus_per_task: 16
        mem: 160G
        partition: coe-gpu
        qos: coe-grade
        # Jobs 5599355 (`h1`), 5599356 (`h2`) and 5599357 (`h5`) died within
        # 45 s on these two nodes with "CUDA error: CUDA-capable device(s)
        # is/are busy or unavailable" (2026-08-30). The GPUs were unusable,
        # not the recipe, so both nodes are excluded.
        exclude: atl1-1-03-011-8-0,atl1-1-03-011-13-0
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,encoder-interface-500m,${vars.arm},seed${vars.seed},lowlevel
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  h2:
    vars:
      wandb_id: ei500-h2
      encoder_arm: h2
      skill_horizon: "2"
    stages: *tracker_stage_coe

  h5:
    vars:
      wandb_id: ei500-h5
      encoder_arm: h5
      skill_horizon: "5"
    stages: *tracker_stage_coe

  h10:
    vars:
      wandb_id: ei500-h10
      encoder_arm: h10
      skill_horizon: "10"
    stages: *tracker_stage_coe

  # ---- phi's conditioning: does the past chunk pay off in TRACKING? -------
  #
  # `srccur10`'s encoder was pretrained with phi conditioning on the past
  # chunk s[t-10..t] instead of s_t alone (`--source_history_steps 10
  # --source_anchor current`). On pretrain eval it did not beat h10: +5.1% on
  # the endpoint term over three seeds, with the per-seed ranges OVERLAPPING,
  # so that penalty is unresolved rather than proven. Pretrain loss is not
  # what we ship, so this arm asks whether it survives into tracking.
  #
  # ANSWERED 2026-08-30 at 500M, seed 0, two checkpoints: it washes out. See
  # the "phi past-chunk conditioning" row group in README.md.
  #
  # Nothing about the interface changes. phi/g/mu are pretrain-only heads and
  # the anchor stayed on s_t, so this encoder's input and output contract are
  # byte-identical to h10's: same 258-wide command, same horizon, same frozen
  # binding. h10 is its matched control, so it runs on the same `coe-gpu`
  # stage as the horizon family.
  #
  # `srcpast10` deliberately has NO tracker arm: its window is anchored on
  # s[t-10], so the frozen command sampler cannot reproduce its encoder input
  # without anchoring on a robot heading ten steps old, which does not exist.
  srccur10:
    vars:
      wandb_id: ei500-srccur10
      encoder_arm: srccur10
      skill_horizon: "10"
    stages: *tracker_stage_coe
