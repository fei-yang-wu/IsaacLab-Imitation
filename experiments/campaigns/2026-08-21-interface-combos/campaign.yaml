# Interface combinations -- do the winning spokes of the 2026-08-19 interface
# design study stack?
#
# The star measured MAIN EFFECTS. This campaign trains the five combination
# and follow-up cells the star results point at, on the SAME protocol (2B
# matched budget, same hub configuration, same data, same recipe), so every
# row reads against `ctrl` (0.9023 SR / 24.49 mm L / 212.3 mm G on
# `paper_testbed4096_v1`) and against its parent spokes:
#
#   use_hold1            0.8921 / 26.44 / 150.4   (hold-1 arms win MPJPE-G)
#   obj_jepa_sigreg_ebm  0.8875 / 27.70 / 212.8   (best-quality objective at 10B)
#   obj_recon            0.8931 / 27.50 / 446.3   (ties SR, +110% global drift)
#   bn_sonic_fsq64       0.8701 / 29.07 / ...     (SONIC token space)
#   ix_fsq64_hold1       0.8496 / 30.45 / 136.9   (64-D hold-1, best G)
#   use_phase_none       0.3679 at hold 10        (phase is load-bearing)
#
# Arms:
#   jepa_ebm_hold1_256d  sigreg_ebm objective x hold 1: the study's best
#                        objective on the study's best-global interface.
#                        NOTE sigreg_ebm ALREADY contains the endpoint DiffSR
#                        loss (it is endpoint + chunk NTP + SIGReg), so this
#                        is also the "endpoint plus JEPA auxiliary" cell.
#   jepa_ebm_hold1_fsq64 the same pair in SONIC's token space -- the
#                        planner-facing interface.
#   recon_endpoint       reconstruction with the ENDPOINT decode target: the
#                        star indicted the input-window target only, and this
#                        is one of its two named follow-ups.
#   recon_full_window    reconstruction decoding state + all ten future slots
#                        including the hidden endpoint -- the other follow-up.
#   hold1_live_phase     hold 1 with a LIVE phase clock (env steps since reset
#                        mod 10) instead of the constant the hold clock pins
#                        at code_period=1.
#
# Two of these arms change TWO fields against ctrl on purpose: they are
# combination cells, and their single-change parents are already measured in
# the star. State both parents when reading a row.
#
# Frozen across every arm: data, env, agent entry point, reward set,
# terminations and their curriculum, reset selection, 16,384 envs x 24,
# gamma 0.97, prefetch mode, network sizes, optimizer -- byte-identical to the
# design study.
name: interface-combos
profile: ice
wandb_project: g1-bones-seed
# Confirmed with the user on 2026-08-21.
wandb_group: interface-combos-2b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  wandb_id: icb-arm

  # ---- The control configuration (the star's hub). An arm overrides only
  # ---- what it changes.
  objective: endpoint
  objective_args: []
  latent_mode: deterministic
  mode_args: []
  z_dim: 256
  command_dim: 258
  code_latent_dim: 256
  ln_args: ["--encoder_layer_norm"]
  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 10
  phase_mode: sin_cos
  # hold = the star's constant-at-hold-1 clock; episode = steps-since-reset
  # mod phase_period. phase_period 0 falls back to code_period.
  phase_source: hold
  phase_period: 0
  command_mode: z
  finetune_args: ["agent.ipmd.hl_skill_finetune_enabled=false"]

  pretrain_updates: 50000
  pretrain_batch_size: 8192
  train_num_envs: 16384
  rollout_steps: 24
  frame_cap: 2000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/interface_combos/${vars.arm}_seed${vars.seed}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"
    - "env.expert_macro_state_terms=${vars.macro_terms}"
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  pretrain_head:
    - --task
    - ${vars.task}
    - --num_envs
    - "16"
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --output_dir
    - ${vars.output_root}/encoder
    - --logger_backend
    - wandb
    - --wandb_project
    - g1-bones-seed
    - --wandb_group
    - interface-combos-2b
    - --wandb_run_name
    - ${vars.wandb_arm}-pretrain-s${vars.seed}
    - --horizon_steps
    - "10"
    - --encoder_window_mode
    - ${vars.window_mode}
    - --transition_objective
    - ${vars.objective}
    - --latent_mode
    - ${vars.latent_mode}
    - --z_dim
    - ${vars.z_dim}

  pretrain_tail:
    - --encoder_hidden_dims
    - "2048"
    - "1024"
    - "512"
    - "512"
    - --encoder_activation
    - silu
    - --diffsr_feature_dim
    - "256"
    - --diffsr_embed_dim
    - "1024"
    - --diffsr_g_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --diffsr_mu_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - "1000"
    - --eval_batches
    - "4"

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=interface-combos-2b
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.output_root}/encoder/checkpoints/latest.pt
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.command_phase_source=${vars.phase_source}
    - agent.ipmd.latent_learning.command_phase_period=${vars.phase_period}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_lowlevel:
    - env.rewards.action_rate_l2.weight=0.0
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.command_interface.reference.selection=random80_adaptive20
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    # The budget axis: eight checkpoints across the 2B run for the milestone
    # curve on `paper_milestone_testbed256_v1`.
    - agent.save_interval=250000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - "agent.policy.num_cells=[2048,2048,1024,1024,512,512]"
    - "agent.value_function.num_cells=[2048,2048,1024,1024,512,512]"
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  output_container_path: /data/interface_combos/${vars.arm}_seed${vars.seed}

arms:
  # The study's best objective (sigreg_ebm = endpoint DiffSR + chunk NTP +
  # SIGReg) on the study's best-global interface (hold 1). Parents:
  # obj_jepa_sigreg_ebm and use_hold1.
  jepa_ebm_hold1_256d:
    vars:
      wandb_id: icb-jepah1
      objective: jepa_ntp
      objective_args: ["--jepa_loss", "sigreg_ebm"]
      hold: 1
      code_latent_dim: ${vars.z_dim}
    stages: &combo_stages
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_head},${vars.objective_args},${vars.mode_args},${vars.ln_args},${vars.pretrain_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,interface-combos,${vars.arm},seed${vars.seed},pretrain
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.finetune_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        depends_on: pretrain
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,interface-combos,${vars.arm},seed${vars.seed},lowlevel,segment1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      # Insurance: a 2B budget normally completes inside segment 1; the hold-1
      # arms re-encode every control step and may not. The budget is global
      # through cumulative_env_frames, so this exits immediately when met.
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.finetune_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,interface-combos,${vars.arm},seed${vars.seed},lowlevel,segment2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # The same objective x hold pair in SONIC's released token space (FSQ 64
  # coordinates x 32 levels). Parents: jepa_ebm_hold1_256d (width),
  # ix_fsq64_hold1 (objective), bn_sonic_fsq64 (hold).
  jepa_ebm_hold1_fsq64:
    vars:
      wandb_id: icb-jepah1fsq
      objective: jepa_ntp
      objective_args: ["--jepa_loss", "sigreg_ebm"]
      latent_mode: sonic_fsq
      z_dim: 64
      command_dim: 66
      hold: 1
      mode_args: ["--sonic_fsq_levels", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32", "32"]
      code_latent_dim: ${vars.z_dim}
    stages: *combo_stages

  # Reconstruction with the ENDPOINT decode target. Same encoder, same frozen
  # rollout path as obj_recon; only the decode target moves. Parent: obj_recon
  # (SR tie, +110% MPJPE-G from the purely local input-window target).
  recon_endpoint:
    vars:
      wandb_id: icb-reconend
      objective: reconstruction
      objective_args: ["--reconstruction_target", "endpoint"]
      code_latent_dim: ${vars.z_dim}
    stages: *combo_stages

  # Reconstruction decoding the state plus ALL ten future slots including the
  # endpoint the encoder never sees. The second named follow-up to obj_recon.
  recon_full_window:
    vars:
      wandb_id: icb-reconfull
      objective: reconstruction
      objective_args: ["--reconstruction_target", "full_window"]
      code_latent_dim: ${vars.z_dim}
    stages: *combo_stages

  # Hold 1 with a live phase clock: env steps since reset mod 10, sin_cos
  # encoded. At code_period=1 the hold clock pins the phase constant, so the
  # star's hold-1 arms effectively ran phase-free while use_phase_none showed
  # the channel is load-bearing at hold 10. Parents: use_hold1, use_phase_none.
  hold1_live_phase:
    vars:
      wandb_id: icb-livephase
      hold: 1
      phase_source: episode
      phase_period: 10
      code_latent_dim: ${vars.z_dim}
    stages: *combo_stages
