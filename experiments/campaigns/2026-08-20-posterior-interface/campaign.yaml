# Posterior interface: the code is learned THROUGH the policy, not pretrained
# offline and frozen.
#
# This is NOT an arm of the 2026-08-19 star. It differs from that study's `ctrl`
# in the whole command-generation path, so it has its own hub and `ctrl` is a
# cross-campaign REFERENCE row, never a one-field control.
#
# Three arms, a 2x2 minus its empty cell, isolating the two signals that can
# shape the code: policy gradient into the encoder, and reconstruction.
# `post_recon` is deliberately the already-proven setting (recon 1.0 with
# through_policy false is what G1ImitationLatentPerStepVQRLOptIPMDConfig runs),
# so a failure there indicts this campaign's wiring rather than the idea.
#
# There is NO pretrain stage. That is the point of the route.
name: posterior-interface
profile: ice
wandb_project: g1-bones-seed
# Confirmed with the user on 2026-08-20.
wandb_group: posterior-interface

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  wandb_id: pi-arm
  through_policy: "true"
  recon_coeff: "0.0"
  kl_coeff: "0.0"
  quantizer: identity
  code_latent_dim: "256"
  command_dim: "258"
  space_args: []

  train_num_envs: 16384
  rollout_steps: 24
  frame_cap: 2000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/posterior_interface/${vars.arm}_seed${vars.seed}

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"
    - "env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
    - env.expert_macro_frame_stride=1
    - env.expert_macro_anchor_mode=robot_heading

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_posterior_root_qpos_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=posterior-interface
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    # The posterior route. No hl_skill checkpoint: there is nothing pretrained.
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    # THE input declaration. `EncoderViewCfg.components` defaults to the
    # full-body trio, which is where the reference qvel enters; for a latent
    # actor this view is the ONLY source of expert terms in the policy group
    # (`policy_command_terms` = actor terms + encoder-view terms), so it also
    # decides what the posterior can read. Set to the root_qpos trio so these
    # arms encode the same 38-value frame the frozen study's control does.
    # It must agree with the entry point's posterior_input_keys; a contract
    # test asserts that.
    - "env.command_interface.encoder.components=[joint_qpos,root_pos,root_ori]"
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=posterior
    - agent.ipmd.latent_steps_min=10
    - agent.ipmd.latent_steps_max=10
    - agent.ipmd.latent_learning.method=patch_autoencoder
    - agent.ipmd.latent_learning.quantizer=${vars.quantizer}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}
    - agent.ipmd.latent_learning.command_phase_mode=sin_cos
    - agent.ipmd.latent_learning.code_period=10
    - agent.ipmd.latent_learning.patch_past_steps=0
    - agent.ipmd.latent_learning.patch_future_steps=9
    - agent.ipmd.latent_learning.train_posterior_through_policy=${vars.through_policy}
    - agent.ipmd.latent_learning.recon_coeff=${vars.recon_coeff}
    - agent.ipmd.latent_learning.kl_coeff=${vars.kl_coeff}

  tuned_lowlevel:
    - env.rewards.action_rate_l2.weight=0.0
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.command_interface.reference.selection=random80_adaptive20
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=250000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - "agent.policy.num_cells=[2048,2048,1024,1024,512,512]"
    - "agent.value_function.num_cells=[2048,2048,1024,1024,512,512]"
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  output_container_path: /data/posterior_interface/${vars.arm}_seed${vars.seed}

arms:
  # reconstruction only, no policy gradient into the encoder; continuous 256-D (identity bottleneck).
  post_recon_ae:
    vars:
      through_policy: "false"
      recon_coeff: "1.0"
      quantizer: identity
      code_latent_dim: "256"
      command_dim: "258"
      space_args: []
      wandb_id: pi-recon-ae
    stages: &posterior_stages
      - name: lowlevel
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.space_args},${vars.lowlevel_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,posterior-interface,${vars.arm},seed${vars.seed},lowlevel
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # reconstruction only, no policy gradient into the encoder; FSQ 64 coordinates.
  post_recon_fsq:
    vars:
      through_policy: "false"
      recon_coeff: "1.0"
      quantizer: fsq
      code_latent_dim: "64"
      command_dim: "66"
      space_args:
        - "agent.ipmd.latent_learning.fsq_levels=[32,32,32,32,32,32,32,32]"
      wandb_id: pi-recon-fsq
    stages: *posterior_stages

  # reconstruction only, no policy gradient into the encoder; EMA VQ, K=512.
  post_recon_vq:
    vars:
      through_policy: "false"
      recon_coeff: "1.0"
      quantizer: vq_ema
      code_latent_dim: "256"
      command_dim: "258"
      space_args:
        - "agent.ipmd.latent_learning.codebook_size=512"
      wandb_id: pi-recon-vq
    stages: *posterior_stages

  # policy gradient only, no reconstruction term; continuous 256-D (identity bottleneck).
  post_pg_ae:
    vars:
      through_policy: "true"
      recon_coeff: "0.0"
      quantizer: identity
      code_latent_dim: "256"
      command_dim: "258"
      space_args: []
      wandb_id: pi-pg-ae
    stages: *posterior_stages

  # policy gradient only, no reconstruction term; FSQ 64 coordinates.
  post_pg_fsq:
    vars:
      through_policy: "true"
      recon_coeff: "0.0"
      quantizer: fsq
      code_latent_dim: "64"
      command_dim: "66"
      space_args:
        - "agent.ipmd.latent_learning.fsq_levels=[32,32,32,32,32,32,32,32]"
      wandb_id: pi-pg-fsq
    stages: *posterior_stages

  # policy gradient only, no reconstruction term; EMA VQ, K=512.
  post_pg_vq:
    vars:
      through_policy: "true"
      recon_coeff: "0.0"
      quantizer: vq_ema
      code_latent_dim: "256"
      command_dim: "258"
      space_args:
        - "agent.ipmd.latent_learning.codebook_size=512"
      wandb_id: pi-pg-vq
    stages: *posterior_stages

  # both signals together; continuous 256-D (identity bottleneck).
  post_pgrecon_ae:
    vars:
      through_policy: "true"
      recon_coeff: "1.0"
      quantizer: identity
      code_latent_dim: "256"
      command_dim: "258"
      space_args: []
      wandb_id: pi-pgrecon-ae
    stages: *posterior_stages

  # both signals together; FSQ 64 coordinates.
  post_pgrecon_fsq:
    vars:
      through_policy: "true"
      recon_coeff: "1.0"
      quantizer: fsq
      code_latent_dim: "64"
      command_dim: "66"
      space_args:
        - "agent.ipmd.latent_learning.fsq_levels=[32,32,32,32,32,32,32,32]"
      wandb_id: pi-pgrecon-fsq
    stages: *posterior_stages

  # both signals together; EMA VQ, K=512.
  post_pgrecon_vq:
    vars:
      through_policy: "true"
      recon_coeff: "1.0"
      quantizer: vq_ema
      code_latent_dim: "256"
      command_dim: "258"
      space_args:
        - "agent.ipmd.latent_learning.codebook_size=512"
      wandb_id: pi-pgrecon-vq
    stages: *posterior_stages

