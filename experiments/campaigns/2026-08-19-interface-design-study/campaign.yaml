# Interface design study -- what makes a learned command interface good for
# whole-body tracking.
#
# STAR DESIGN, not a grid. `ctrl` is the hub; every other arm changes exactly
# ONE field from it, so each arm has a stated control and the cost is linear in
# axes rather than combinatorial. A star measures MAIN EFFECTS ONLY; the one
# interaction known to be real (code width x hold) gets the explicit
# `ix_fsq64_hold1` probe that completes its 2x2.
#
# Every arm trains to the SAME 2B frames. No arm is promoted to a longer
# budget, because promoting the winners would select on the outcome and would
# leave the table with rows of different budgets. Budget is instead an AXIS:
# checkpoints land every 250M frames and are scored on
# `paper_milestone_testbed256_v1`, so a design conclusion that only holds at
# one end of the curve is reported as budget-dependent. That matters here --
# the 2026-07-22 10M gate ranked `gumbel` first and `fsq` near-flat, and
# neither ordering survived to 10B.
#
# TIERS. 1 = the study's core, seeds 0 and 1. 2 = supporting, single seed,
# droppable. 3 = the interaction probe. 4 = DEFERRED by user decision on
# 2026-08-19 and NOT planned or submitted: the three co-trained arms wait on
# an encoder-from-checkpoint eval path, and `use_phi`/`use_z_phi` are dropped
# for now. They stay defined so the design is intact and re-enabling is a
# one-field change.
#
# Frozen across every arm: data, env, agent entry point, reward set,
# terminations and their curriculum, reset selection, 16,384 envs x 24,
# gamma 0.97, prefetch mode, network sizes, optimizer.
name: interface-design-study
profile: ice
wandb_project: g1-bones-seed
# Confirmed with the user on 2026-08-19.
wandb_group: interface-design-study

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  wandb_id: ids-arm
  tier: 1

  # ---- The control configuration. An arm overrides only what it changes. ----
  objective: endpoint
  objective_args: []
  latent_mode: deterministic
  mode_args: []
  z_dim: 256
  command_dim: 258
  code_latent_dim: 256
  ln_args: ["--encoder_layer_norm"]
  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 10
  phase_mode: sin_cos
  command_mode: z
  finetune_args: ["agent.ipmd.hl_skill_finetune_enabled=false"]

  pretrain_updates: 50000
  pretrain_batch_size: 8192
  train_num_envs: 16384
  rollout_steps: 24
  # The matched screen budget. Every walltime segment receives the full target;
  # the resume checkpoint carries cumulative_env_frames, so the chain stops here.
  frame_cap: 2000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/interface_design_study/${vars.arm}_seed${vars.seed}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"
    - "env.expert_macro_state_terms=${vars.macro_terms}"
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  pretrain_head:
    - --task
    - ${vars.task}
    - --num_envs
    - "16"
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --output_dir
    - ${vars.output_root}/encoder
    - --logger_backend
    - wandb
    - --wandb_project
    - g1-bones-seed
    - --wandb_group
    - interface-design-study
    - --wandb_run_name
    - ${vars.wandb_arm}-pretrain-s${vars.seed}
    - --horizon_steps
    - "10"
    - --encoder_window_mode
    - ${vars.window_mode}
    - --transition_objective
    - ${vars.objective}
    - --latent_mode
    - ${vars.latent_mode}
    - --z_dim
    - ${vars.z_dim}

  pretrain_tail:
    - --encoder_hidden_dims
    - "2048"
    - "1024"
    - "512"
    - "512"
    - --encoder_activation
    - silu
    - --diffsr_feature_dim
    - "256"
    - --diffsr_embed_dim
    - "1024"
    - --diffsr_g_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --diffsr_mu_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - "1000"
    - --eval_batches
    - "4"


  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=interface-design-study
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.output_root}/encoder/checkpoints/latest.pt
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_lowlevel:
    - env.rewards.action_rate_l2.weight=0.0
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.command_interface.reference.selection=random80_adaptive20
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    # The budget axis: eight checkpoints across the 2B run, so the milestone
    # curve has points at 0.25B .. 2.0B. Thin to the five reported points after
    # mirroring; ICE scratch filling already forced one emergency thinning.
    - agent.save_interval=250000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - "agent.policy.num_cells=[2048,2048,1024,1024,512,512]"
    - "agent.value_function.num_cells=[2048,2048,1024,1024,512,512]"
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  output_container_path: /data/interface_design_study/${vars.arm}_seed${vars.seed}

arms:
  # tier 1. The hub. Endpoint DiffSR, continuous 256-D, LN on, root_qpos, stride 1, robot_heading, hold 10, sin_cos phase, command mode z, frozen encoder.
  ctrl:
    vars:
      tier: 1
      wandb_id: ids-ctrl
      code_latent_dim: ${vars.z_dim}
    stages: &study_stages
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_head},${vars.objective_args},${vars.mode_args},${vars.ln_args},${vars.pretrain_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,interface-design-study,${vars.arm},seed${vars.seed},tier${vars.tier},pretrain
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.finetune_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        depends_on: pretrain
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,interface-design-study,${vars.arm},seed${vars.seed},tier${vars.tier},lowlevel,segment1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      # Insurance only. A 2B budget is about 5.3 h at 104k fps, so segment 1
      # normally reaches the cap alone; the slow arms (hold 1 re-encodes every
      # control step, the co-trained arms carry an extra optimizer) may not.
      # The budget is global through cumulative_env_frames, so this segment
      # exits immediately when segment 1 already met it.
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.finetune_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,interface-design-study,${vars.arm},seed${vars.seed},tier${vars.tier},lowlevel,segment2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # tier 1. Predict the endpoint DELTA rather than the endpoint.
  obj_endpoint_delta:
    vars:
      tier: 1
      wandb_id: ids-objdelta
      objective: endpoint_delta
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Successor-representation occupancy instead of a single endpoint.
  obj_state_occupancy:
    vars:
      tier: 1
      wandb_id: ids-objocc
      objective: state_occupancy
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Semi-Markov chain factorization of the skill transition.
  obj_semimarkov:
    vars:
      tier: 1
      wandb_id: ids-objsemi
      objective: semimarkov_chain
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Autoencoding: MSE onto the exact 380-value encoder input window. The reconstruction decoder is offline-only; the tracker still reads z.
  obj_recon:
    vars:
      tier: 1
      wandb_id: ids-objrecon
      objective: reconstruction
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Latent-space next-token prediction with the SIGReg energy. `--jepa_loss` is passed explicitly even though sigreg is the parser default, so this cell's identity is on the command line rather than in a default.
  obj_jepa_ntp:
    vars:
      tier: 1
      wandb_id: ids-objntp
      objective: jepa_ntp
      objective_args:
        - "--jepa_loss"
        - "sigreg"
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. JEPA with the energy-based SIGReg variant that reached 10B in the bottleneck campaign.
  obj_jepa_sigreg_ebm:
    vars:
      tier: 1
      wandb_id: ids-objebm
      objective: jepa_ntp
      objective_args:
        - "--jepa_loss"
        - "sigreg_ebm"
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 2. JEPA with a contrastive InfoNCE energy. Never trained here.
  obj_jepa_infonce:
    vars:
      tier: 2
      wandb_id: ids-objinfo
      objective: jepa_ntp
      objective_args:
        - "--jepa_loss"
        - "infonce"
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 2. The legacy g(z)^T F(s) successor head instead of the concat head. Implemented, never run.
  obj_phi_bilinear:
    vars:
      tier: 2
      wandb_id: ids-objbilin
      objective_args:
        - "--diffsr_phi_parameterization"
        - "bilinear"
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Gaussian posterior with a KL penalty (beta-VAE bottleneck).
  bn_gaussian:
    vars:
      tier: 1
      wandb_id: ids-bngauss
      latent_mode: gaussian
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. SONIC's released token space: FSQ 64 coordinates x 32 levels, 320 bits.
  bn_sonic_fsq64:
