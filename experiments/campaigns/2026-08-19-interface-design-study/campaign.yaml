  # tier 2. Macro anchor in the expert's heading frame (the pre-v1.1 variant).
  in_anchor_expert_heading:
    vars:
      tier: 2
      wandb_id: ids-inanchexp
      anchor_mode: expert_heading
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Publish and re-encode every control step instead of holding ten. 50 commands/s instead of 5.
  use_hold1:
    vars:
      tier: 1
      wandb_id: ids-usehold1
      hold: 1
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. The midpoint of the hold axis, added 2026-08-26. `ctrl` (hold 10)
  # and `use_hold1` bracket it, so the three arms read as one 10 / 5 / 1 curve
  # rather than a two-point line with an assumed shape between the ends.
  use_hold5:
    vars:
      tier: 1
      wandb_id: ids-usehold5
      hold: 5
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Drop the 2-wide sin_cos slot clock, so the command is z alone.
  use_phase_none:
    vars:
      tier: 1
      wandb_id: ids-usenophase
      phase_mode: none
      command_dim: 256
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 4. Policy gradient into the encoder during RL, with no offline term: the PG contribution of SONIC's co-training in isolation.
  use_cotrain_pg:
    vars:
      tier: 4
      wandb_id: ids-usecotpg
      finetune_args:
        - "agent.ipmd.hl_skill_finetune_enabled=true"
        - "agent.ipmd.hl_skill_pg_coeff=0.05"
        - "agent.ipmd.hl_skill_offline_diffsr_coeff=0.0"
        - "agent.ipmd.hl_skill_anchor_coeff=0.0"
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 4. SONIC's recipe: policy gradient plus the offline objective and the anchor term, all live during RL.
  use_cotrain_sonic:
    vars:
      tier: 4
      wandb_id: ids-usecotson
      finetune_args:
        - "agent.ipmd.hl_skill_finetune_enabled=true"
        - "agent.ipmd.hl_skill_pg_coeff=0.05"
        - "agent.ipmd.hl_skill_offline_diffsr_coeff=1.0"
        - "agent.ipmd.hl_skill_anchor_coeff=0.01"
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 4. Keep training the encoder online but WITHOUT policy gradient. Against use_cotrain_sonic this isolates the PG term itself.
  use_cotrain_no_pg:
    vars:
      tier: 4
      wandb_id: ids-usecotnopg
      finetune_args:
        - "agent.ipmd.hl_skill_finetune_enabled=true"
        - "agent.ipmd.hl_skill_pg_coeff=0.0"
        - "agent.ipmd.hl_skill_offline_diffsr_coeff=1.0"
        - "agent.ipmd.hl_skill_anchor_coeff=0.01"
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 4. Publish the DiffSR feature phi(s) instead of the code z. Implemented, never trained: the smoke must confirm the 258-D width before submit.
  use_phi:
    vars:
      tier: 4
      wandb_id: ids-usephi
      command_mode: phi
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 4. Publish z and phi concatenated, 512 + 2. Implemented, never trained: the smoke must confirm the 514-D width before submit.
  use_z_phi:
    vars:
      tier: 4
      wandb_id: ids-usezphi
      command_mode: z_phi
      command_dim: 514
      code_latent_dim: 512
    stages: *study_stages

  # tier 3. The known dead zone: 64-D at hold 1. Completes the width x hold 2x2 whose other three cells are ctrl, use_hold1 and bn_sonic_fsq64. A collapse here IS the result.
