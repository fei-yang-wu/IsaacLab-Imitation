  # tier 1. Single EMA VQ codebook, K=512: 9 bits, the narrow end of the axis.
  bn_vq_ema:
    vars:
      tier: 1
      wandb_id: ids-bnvq
      latent_mode: vq
      mode_args:
        - "--vq_codebook_size"
        - "512"
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Grouped Gumbel-softmax at 64 groups x 32 categories: FSQ's exact bit budget with learned levels instead of the fixed 1/16 lattice.
  bn_gumbel_multicat:
    vars:
      tier: 1
      wandb_id: ids-bngmc
      latent_mode: gumbel_multicat
      z_dim: 64
      command_dim: 66
      mode_args:
        - "--categorical_groups"
        - "64"
        - "--categorical_categories"
        - "32"
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Continuous width 64 -- the continuous partner of the FSQ-64 point.
  bn_cont64:
    vars:
      tier: 1
      wandb_id: ids-bncont64
      z_dim: 64
      command_dim: 66
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 1. Continuous width 128, the midpoint of the width sweep.
  bn_cont128:
    vars:
      tier: 1
      wandb_id: ids-bncont128
      z_dim: 128
      command_dim: 130
      code_latent_dim: ${vars.z_dim}
    stages: *study_stages

  # tier 2. FSQ 32 x 32 = 160 bits. Halves the width at fixed levels.
  bn_sonic_fsq32:
