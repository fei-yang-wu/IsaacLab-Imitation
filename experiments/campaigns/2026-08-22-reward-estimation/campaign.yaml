# IPMD direct reward estimation (IRL) on the v2 trackers.
#
# Arms (each adds the reward-estimation stack to a known tracker recipe;
# PPO always trains on the task reward, use_estimated_rewards_for_ppo=false,
# so every tracker row stays comparable to its non-IRL counterpart):
#
#   irl_explicit_root_qpos   tuned explicit 38-D root_qpos tracker, vanilla
#                            estimator coefficients (no regularizer). The
#                            2026-08-22 first submission; kept byte-stable
#                            for resumes.
#   irl_gp_explicit_root_qpos  same tracker, estimator trained with the
#                            R1-style input-gradient penalty (the anti-
#                            saturation follow-up: the vanilla arm railed
#                            its tanh output within 30 iterations).
#   irl_gp_latent_ln_hold1   the current latent HEADLINE tracker recipe
#                            (cont_det_ln_hold1 from
#                            2026-08-15-latent-bottleneck-10b: 256-D
#                            continuous deterministic encoder + LayerNorm,
#                            hold 1, root_qpos macro state), reusing that
#                            arm's exact pretrained encoder from ICE, plus
#                            the grad-penalty estimator. Differs from the
#                            headline row ONLY in the reward-estimation
#                            stack.
#
# The reward-estimation stack: `env.enable_reward_input_observations=true`
# opts the v2 surface into the normalized [0, 1] reward_input group (joint
# positions by soft limits, relative anchor position, relative anchor rot6d
# -- see `isaaclab_imitation.envs.reward_input_normalization`);
# `agent.reward_estimation=true` trains the estimator (r(s), tanh output).
# The grad penalty rides the declarative
# `agent.reward_estimation_grad_penalty_coeff` field: a direct
# `agent.ipmd.reward_grad_penalty_coeff` override would be zeroed by the
# reward-estimation switch, which runs after Hydra overrides.
#
# W&B goes to its own project (g1-reward-estimation), per user directive
# 2026-08-22.
name: reward-estimation
profile: ice
wandb_project: g1-reward-estimation
wandb_group: irl-explicit-10b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  # RLOpt adds a `logdir:<19-char timestamp>_wandb-<run id>` tag; W&B caps a
  # tag at 64 chars, so the run id must stay <= 31 chars.
  wandb_id: irl-expl
  wandb_group_name: irl-explicit-10b
  train_num_envs: 16384
  rollout_steps: 24
  frame_cap: 10000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}
  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/reward_estimation/${vars.arm}_seed${vars.seed}
  # The headline arm's pretrained encoder (bit-identical reuse, dyn-arm
  # style); consumed only by the latent arm.
  ln_hold1_encoder: /data/bottleneck_10b/cont_det_ln_hold1_seed0/encoder/checkpoints/latest.pt

  # ---- Per-arm axes ----
  # R1-style squared input-gradient penalty on the estimator. 0.0 reproduces
  # the vanilla arm; the gp arms use RLOpt's historical default 0.5; the hp
  # ("harsh penalty") arms use 5.0. Measured 2026-08-23: 0.5 did NOT prevent
  # tanh rail saturation (reward_diff -2.0 by ~1B frames) -- R1 has no force
  # at the rails, hence the logit-reg term on the hp arms.
  grad_penalty: 0.0
  # Squared pre-activation (logit) magnitude penalty; directly opposes rail
  # saturation. 0.0 everywhere except the hp arms.
  logit_reg: 0.0
  # Goal-conditioned (paired) estimator input: adds the commanded reference
  # joints to the policy-side reward_input (the expert side pairs its own
  # joints with themselves), so the estimator learns a tracking metric
  # r(s, g). false reproduces every pre-pairing arm byte-for-byte.
  pair_input: "false"
  reward_args:
    - env.enable_reward_input_observations=true
    - agent.reward_estimation=true
    - agent.reward_estimation_grad_penalty_coeff=${vars.grad_penalty}
    - agent.reward_estimation_logit_reg_coeff=${vars.logit_reg}
    - agent.reward_estimation_pair_input=${vars.pair_input}
  # The explicit single-frame root_qpos command (the 08-05 explicit recipe).
  explicit_interface:
    - env.command_interface.actor=explicit
    - "env.command_interface.actor.components=[joint_qpos,root_pos,root_ori]"
    - agent.ipmd.use_latent_command=false
    - agent.command_space=root_qpos
    - "agent.command_components=[joint_qpos,root_pos,root_ori]"
    - agent.ipmd.command_source=random
    - agent.ipmd.hl_skill_checkpoint_path=null
  # The headline latent interface (cont_det_ln_hold1): 258-D command from the
  # frozen pretrained encoder, hold 1.
  ln_hold1_interface:
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=258
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=258
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.ln_hold1_encoder}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=z
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=1
    - agent.ipmd.latent_steps_max=1
    - agent.ipmd.latent_learning.code_period=1
    - agent.ipmd.latent_learning.command_phase_mode=sin_cos
    - agent.ipmd.latent_learning.code_latent_dim=256
  interface_args: ${vars.explicit_interface}
  # The latent arm needs the DiffSR macro state (root_qpos trio, SONIC v1.1
  # anchor frame), exactly as the headline campaign declared it.
  macro_args: []
  ln_hold1_macro:
    - "env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
    - env.expert_macro_frame_stride=1
    - env.expert_macro_anchor_mode=robot_heading
  # The explicit arms keep next_and_reset (their 08-22 submission state); the
  # headline latent recipe trained with `next` -- reproduce it exactly.
  prefetch_mode: next_and_reset

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-reward-estimation
    - agent.logger.group_name=${vars.wandb_group_name}
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

  tuned_lowlevel:
    - env.rewards.action_rate_l2.weight=0.0
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.command_interface.reference.selection=random80_adaptive20
    - env.data.reference_prefetch_mode=${vars.prefetch_mode}

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - "agent.policy.num_cells=[2048,2048,1024,1024,512,512]"
    - "agent.value_function.num_cells=[2048,2048,1024,1024,512,512]"
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  seg1_args: []
  resume_args:
    # The termination curriculum (5M -> 30M) completes inside segment 1; a
    # resume pins the strict post-anneal terminations.
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
    - /data/bottleneck_10b/cont_det_ln_hold1_seed0/encoder/checkpoints/latest.pt
  output_container_path: /data/reward_estimation/${vars.arm}_seed${vars.seed}

arms:
  irl_explicit_root_qpos:
    vars: {}
    stages: &irl_stages
      # Segment 1: fresh start, curriculum on. Full 10B target; the 16h
      # walltime ends it early and the SIGTERM/periodic checkpoint carries
      # `cumulative_env_frames` into the next segment. Never shrink
      # max_iterations to fit the walltime.
      - name: lowlevel
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.interface_args},${vars.reward_args},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.macro_args},${vars.seg1_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: reward-estimation,irl,${vars.arm},seed${vars.seed},lowlevel
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      # Chained continuations; each exits immediately if the budget is met.
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.interface_args},${vars.reward_args},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.macro_args},${vars.resume_args}}
        depends_on: lowlevel
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: reward-estimation,irl,${vars.arm},seed${vars.seed},lowlevel,segment2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel3
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.interface_args},${vars.reward_args},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.macro_args},${vars.resume_args}}
        depends_on: lowlevel2
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: reward-estimation,irl,${vars.arm},seed${vars.seed},lowlevel,segment3
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      # Manual relaunch until cumulative_env_frames reaches 10B: re-plan with
      # `--only-stage lowlevel_resume` (dropping the dependency is automatic).
      - name: lowlevel_resume
        depends_on: lowlevel3
        dependency_kind: afterany
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.interface_args},${vars.reward_args},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.macro_args},${vars.resume_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: reward-estimation,irl,${vars.arm},seed${vars.seed},lowlevel,resume
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # Grad-penalty estimator on the explicit tracker. One variable against
  # irl_explicit_root_qpos: the R1 input-gradient penalty (0.0 -> 0.5).
  irl_gp_explicit_root_qpos:
    vars:
      wandb_id: irl-gp-expl
      wandb_group_name: irl-gp-10b
      grad_penalty: 0.5
    stages: *irl_stages

  # Grad-penalty estimator on the current latent HEADLINE tracker recipe
  # (cont_det_ln_hold1), reusing the headline arm's exact pretrained encoder.
  # Against the headline 10B row the arm differs only in the
  # reward-estimation stack; against irl_gp_explicit_root_qpos it differs
  # only in the command interface.
  irl_gp_latent_ln_hold1:
    vars:
      wandb_id: irl-gp-ln1
      wandb_group_name: irl-gp-10b
      grad_penalty: 0.5
      interface_args: ${vars.ln_hold1_interface}
      macro_args: ${vars.ln_hold1_macro}
      prefetch_mode: next
    stages: *irl_stages

  # Harsh-penalty arms (2026-08-23, after the gp arms railed by ~1B frames):
  # 10x grad penalty plus the logit-reg term, which acts on the
  # pre-activation magnitude and therefore has force AT the rails where R1
  # does not.
  irl_hp_explicit_root_qpos:
    vars:
      wandb_id: irl-hp-expl
      wandb_group_name: irl-hp-10b
      grad_penalty: 5.0
      logit_reg: 0.01
    stages: *irl_stages

  irl_hp_latent_ln_hold1:
    vars:
      wandb_id: irl-hp-ln1
      wandb_group_name: irl-hp-10b
      grad_penalty: 5.0
      logit_reg: 0.01
      interface_args: ${vars.ln_hold1_interface}
      macro_args: ${vars.ln_hold1_macro}
      prefetch_mode: next
    stages: *irl_stages

  # Goal-conditioned (paired) estimator arms (2026-08-23, user-approved
  # design): the estimator input pairs the robot's achieved joints with the
  # commanded reference joints (67-wide), learning a tracking metric r(s, g)
  # instead of bare expert-likeness. Expert information reaches only the
  # reward_input group; the actor's expert view stays the command interface.
  # Harsh regularizers carried over — pairing makes discrimination easier,
  # so saturation pressure is higher, not lower.
  irl_pair_explicit_root_qpos:
    vars:
      wandb_id: irl-pr-expl
      wandb_group_name: irl-pair-10b
      grad_penalty: 5.0
      logit_reg: 0.01
      pair_input: "true"
    stages: *irl_stages

  irl_pair_latent_ln_hold1:
    vars:
      wandb_id: irl-pr-ln1
      wandb_group_name: irl-pair-10b
      grad_penalty: 5.0
      logit_reg: 0.01
      pair_input: "true"
      interface_args: ${vars.ln_hold1_interface}
      macro_args: ${vars.ln_hold1_macro}
      prefetch_mode: next
    stages: *irl_stages
