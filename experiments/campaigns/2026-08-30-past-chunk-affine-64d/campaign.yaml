# Past-chunk conditioning at 64-D, concat vs affine phi.
#
# Two questions in one pair of arms, sharing one encoder recipe.
#
# 1. PAST CHUNK. phi conditions on `s[t-5..t]` instead of `s_t` alone
#    (`--source_history_steps 5 --source_anchor current`). The macro state is
#    `root_qpos` and carries no velocities, so one frame cannot express which
#    way the motion is already going; the past supplies that and z is left to
#    carry the rest. Five frames, not ten: the Tier B linear probe over 2,998
#    held-out windows predicts `s[t+10]` from the past at R2 0.751 with two
#    frames and 0.730 with eleven, so the information saturates early. phi's
#    source is 228 values (6 x 38) instead of 418 at past-10 or 38 at `s_t`.
#
# 2. PHI PARAMETERIZATION. `p5_concat` keeps the production concat path;
#    `p5_affine` uses `--diffsr_phi_parameterization affine`, phi(s,z) =
#    F(s)^T (A z + b) / sqrt(E), which makes the denoising score field affine
#    in z so an interpolated latent grounds to the geometric mixture of its
#    endpoints' conditionals. The two axes compose in code without change:
#    `_build_diffsr` widens phi's `obs_dim` to
#    `state_dim * (source_history_steps + 1)` and passes
#    `phi_parameterization` separately, so the past chunk enters F(s) and the
#    affine constraint binds only the z path.
#
# WHY THE MERGED HEAD AND NOT `diffntp_chunk`. At 64-D and hold 1 the two-head
# form has never trained: `leader64_h1_nophase` was cancelled at 0.84B with
# episode length plateaued at 50-62 and MPJPE-L flat near 51 mm, while its
# 256-D control was at 166 / 42.6 mm by 0.17B, and its encoder pretrain was
# provably healthy. The merged head at the same width and hold is the
# confirmed star-v2 hub, so both arms take it:
# `--jepa_ntp_chunk_span boundary_next --jepa_endpoint_coeff 0`.
#
# WHAT THIS PAIR CAN AND CANNOT ATTRIBUTE. Between the two arms exactly one
# flag moves, so concat-vs-affine at 64-D with a past chunk is clean. There is
# NO matched no-past control at 64-D in this campaign (user decision,
# 2026-08-30). The nearest reference is `merged64_pen_ramp_5b` in
# 2026-08-22-pareto-stack (0.9543 SR / 23.67 mm L / 89.33 mm G clean at 5B),
# which differs by the past chunk AND by encoder pretrain provenance, the
# 16,384-environment rollout, and the frozen `rlopt_ipmd_tuned` optimizer
# geometry. Treat it as a reference row, not a control.
#
# OPTIMIZER GEOMETRY. Both arms use
# `--agent rlopt_ipmd_tuned_fullbatch_cfg_entry_point`, the geometry promoted
# 2026-08-30 (full batch, 3 epochs, +18.9% frames per unit wall-clock). That
# class sets `loss.mini_batch_size` to a sentinel that `train_impl.py` clamps
# to the whole rollout, so this campaign must NOT pass
# `agent.loss.mini_batch_size`: a literal would silently become a partial
# batch. Read the class docstring before citing the recipe.
#
# NO INTERPOLATION PROBE STAGE. `probe_latent_interpolation` reads
# `diffsr_state_dict`, the endpoint head, which `--jepa_endpoint_coeff 0`
# leaves untrained. The merged objective's head is `jepa["ntp_diffsr"]`, which
# the probe cannot load yet. Run the probe only after it grows a chunk-head
# option.
#
# The ramp keys off common_step_counter, which restarts per segment. Segment 1
# carries the 0.8 -> 0.2 failure-share ramp; segment 2 PINS the landed 0.2 so a
# restart never re-runs it.
name: past-chunk-affine-64d
profile: ice
wandb_project: g1-bones-seed
# Confirmed with the user 2026-08-30.
wandb_group: past-chunk-affine-64d

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}

  # --- Latent interface: the star-v2 64-D hub ---
  z_dim: 64
  command_dim: 66
  code_latent_dim: 64
  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  phase_source: hold
  phase_period: 0
  command_mode: z
  finetune_args: ["agent.ipmd.hl_skill_finetune_enabled=false"]

  # --- Encoder pretraining ---
  # The per-arm variable. Overridden by each arm.
  phi_parameterization: concat
  # Shared by both arms: phi sees s[t-5..t], anchored on s_t, so the encoder's
  # own input and the deployed 66-wide command are untouched.
  source_args: ["--source_history_steps", "5", "--source_anchor", "current"]
  pretrain_updates: 50000
  pretrain_batch_size: 8192
  encoder_ckpt: ${vars.output_root}/encoder/checkpoints/latest.pt
  encoder_source: pretrained

  # --- Tracker scale: 20,480 x 24 = 491,520 frames per batch ---
  train_num_envs: 20480
  rollout_steps: 24
  frame_cap: 5000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/past_chunk_affine_64d/${vars.arm}_seed${vars.seed}

  # merged64_pen_ramp_5b rewards; feet_acc -2.5e-6 comes from the in-tree
  # default (corrected 2026-08-28).
  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03

  # Failure-share ramp 0.8 -> 0.2 over the first 1B (segment 1 only). This MUST
  # replace the selection preset with `sonic`: under `random80_adaptive20` the
  # outer wrapper stays active and adaptive_uniform_ratio only rescales the
  # remaining 20% branch.
  select_ramp:
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.8
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=0.2
    - env.command_interface.reference.selection.adaptive_ratio_ramp_frames=1000000000
  select_hold:
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.2
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=null

  pretrain_head:
    - --task
    - ${vars.task}
    - --num_envs
    - "16"
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --output_dir
    - ${vars.output_root}/encoder
    - --logger_backend
    - wandb
    - --wandb_project
    - g1-bones-seed
    - --wandb_group
    - past-chunk-affine-64d
    - --wandb_run_name
    - ${vars.wandb_arm}-pretrain-s${vars.seed}
    - --horizon_steps
    - "10"
    - --encoder_window_mode
    - ${vars.window_mode}
    - --transition_objective
    - jepa_ntp
    - --jepa_loss
    - sigreg_ebm
    - --jepa_ntp_head
    - diff_chunk
    - --jepa_ntp_chunk_span
    - boundary_next
    - --jepa_endpoint_coeff
    - "0"
    - --diffsr_phi_parameterization
    - ${vars.phi_parameterization}
    - --latent_mode
    - deterministic
    - --z_dim
    - ${vars.z_dim}
    - --encoder_layer_norm

  pretrain_tail:
    - --encoder_hidden_dims
    - "2048"
    - "1024"
    - "512"
    - "512"
    - --encoder_activation
    - silu
    - --diffsr_feature_dim
    - "256"
    - --diffsr_embed_dim
    - "1024"
    - --diffsr_g_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --diffsr_mu_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - "1000"
    - --eval_batches
    - "4"

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_fullbatch_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=past-chunk-affine-64d
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.command_phase_source=${vars.phase_source}
    - agent.ipmd.latent_learning.command_phase_period=${vars.phase_period}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.data.reference_prefetch_mode=next

  # No `agent.loss.mini_batch_size` here: the fullbatch entry point owns it.
  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=250000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
  output_container_path: ${vars.output_root}

arms:
  # Production phi with the past chunk: the concat path, 228-wide source.
  p5_concat:
    vars:
      wandb_id: pca64-p5concat
      phi_parameterization: concat
    stages: &past_chunk_stages
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_head},${vars.source_args},${vars.pretrain_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-affine-64d,${vars.arm},seed${vars.seed},pretrain
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.finetune_args},${vars.reward_args},${vars.select_ramp},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        depends_on: pretrain
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-affine-64d,${vars.arm},seed${vars.seed},lowlevel,segment1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.finetune_args},${vars.reward_args},${vars.select_hold},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-affine-64d,${vars.arm},seed${vars.seed},lowlevel,segment2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # The same past chunk with phi affine in z, so the score field interpolates.
  p5_affine:
    vars:
      wandb_id: pca64-p5affine
      phi_parameterization: affine
    stages: *past_chunk_stages
