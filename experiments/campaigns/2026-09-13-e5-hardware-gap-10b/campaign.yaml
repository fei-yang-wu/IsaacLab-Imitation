# 2026-09-13 -- hardware-gap fine-tunes off the e5 hub (rate05 + energy
# penalty, 70,000,312,320 frames), 10B each, one variable per arm.
# PREPARED, NOT SUBMITTED (user, 2026-09-13).
#
# What the 09-13 hardware runs showed (memory `hardware-dither-analysis-2026-09-13`,
# `ec-inference-latency-2026-09-13`): standing matches SONIC; walking dither
# is bursty and coincides with 15-29 mm single-tick jumps of the odometry the
# live anchor now follows; the new 50 Hz target lands 3-5 ms after the state
# sample (Isaac: 0); the plant is optimistic on heavy lifts. Each arm trains
# the policy against one of those gaps, on top of e5's own arguments
# verbatim (action_rate_l2 -0.5, energy_consumption -1e-4, robot_heading
# window). The normalizer is REALLY frozen this time (RLOpt 298f172).
#
#   d1  actuation delay 0-1 physics sub-steps (0-5 ms), drawn per env at reset
#   d2  actuation delay 0-2 sub-steps (0-10 ms)
#   g1  PD gain scale 0.9-1.1 per env (stiffness and damping), startup
#   a1  anchor-jitter DR on the live window anchor: random walk std 2 mm/step
#       clipped at 10 cm, +-5 mm jitter, 2 % chance per step of a +-3 cm jump
#       (the hardware odometry envelope)
#   r1  adaptive reset at SONIC's values: uniform 0.1 (was 0.2),
#       failure_rate_max_over_mean 200 (was 50): more mass on the bins that
#       keep failing (foot_pos_xyz clips)
#   h1  expert_heading window (anchor-blind, SONIC's actor design): no
#       localization on hardware, latents precomputable offline; costs
#       Isaac MPJPE-G, which hardware never measures
#   c1  d1 + g1 + a1 + r1 together: the deployment-realism bundle
#
# Not an arm: SONIC's exploration clamp (std 0.05, clip [0.001, 0.5]). e5's
# per-joint std is already 0.043-0.092, so the clamp would be a no-op;
# `agent.sonic_release_optimizer=true` is also inert through Hydra (applied
# in __post_init__ before overrides land) and must never be used as an arm.
# Trained-in EMA (ema_alpha) is not here because the exported bundle / EC
# decode do not apply it yet.
#
# Two chained 15:59 segments per arm; segment 1 starts from the hub FILE,
# segment 2 resumes from the arm's tree. Caps: 80,000,312,320. W&B project
# g1-bs-finetune (user, 2026-09-13), group e5-hardware-gap-10b.
name: e5-hardware-gap-10b
profile: ice
wandb_project: g1-bs-finetune
wandb_group: e5-hardware-gap-10b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  agent_entry: rlopt_ipmd_tuned_fullbatch_cfg_entry_point

  train_num_envs: 16384
  rollout_steps: 24
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  frame_cap: 80000312320
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  anchor_mode: robot_heading
  adaptive_uniform_ratio: 0.2
  adaptive_max_over_mean: 50.0
  arm_args: []

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  source_ckpt: /data/energy_torque_10b/e5_seed0/tracker/2026-09-11_14-52-15_wandb-smooth-e5-s0-58c8d0/models/model_step_70000312320.pt
  output_root: /data/e5_hardware_gap_10b/${vars.arm}_seed${vars.seed}
  encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt

  delay_1:
    - env.actions.joint_pos.delay_substeps_min=0
    - env.actions.joint_pos.delay_substeps_max=1
  delay_2:
    - env.actions.joint_pos.delay_substeps_min=0
    - env.actions.joint_pos.delay_substeps_max=2
  gain_dr:
    - env.events.randomize_actuator_gains.params.stiffness_distribution_params=[0.9,1.1]
    - env.events.randomize_actuator_gains.params.damping_distribution_params=[0.9,1.1]
  anchor_jitter:
    - env.expert_macro_anchor_walk_std=0.002
    - env.expert_macro_anchor_walk_max=0.1
    - env.expert_macro_anchor_jitter=0.005
    - env.expert_macro_anchor_jump_prob=0.02
    - env.expert_macro_anchor_jump=0.03

  base_args:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - ${vars.agent_entry}
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-finetune
    - agent.logger.group_name=e5-hardware-gap-10b
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=66
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=66
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=z
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=1
    - agent.ipmd.latent_steps_max=1
    - agent.ipmd.latent_learning.code_period=1
    - agent.ipmd.latent_learning.command_phase_mode=sin_cos
    - agent.ipmd.latent_learning.code_latent_dim=64
    - env.rewards.tracking_reward_points.weight=4.0
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.5
    - env.rewards.energy_consumption.weight=-1.0e-4
    - agent.optim.weight_decay=1.0e-2
    - agent.ipmd.critic_lr_schedule=constant
    - agent.ipmd.critic_lr_final=1.0e-5
    - env.observations.policy.projected_gravity.history_length=10
    - env.observations.policy.base_ang_vel.history_length=10
    - env.observations.policy.joint_pos_rel.history_length=10
    - env.observations.policy.joint_vel_rel.history_length=10
    - env.observations.policy.last_action.history_length=10
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=${vars.adaptive_uniform_ratio}
    - env.command_interface.reference.selection.adaptive_failure_rate_max_over_mean=${vars.adaptive_max_over_mean}
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=null
    - env.data.reference_prefetch_mode=next
    - env.enable_termination_curriculum=false
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu
    - agent.ppo.update_normalizers_after_rollout=false
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]
    - env.expert_macro_frame_stride=1
    - env.expert_macro_anchor_mode=${vars.anchor_mode}
  seg1_tail:
    - --checkpoint
    - ${vars.source_ckpt}
  seg2_tail:
    - --checkpoint
    - ${vars.output_root}/tracker


shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
    - ${vars.encoder_ckpt}
    - ${vars.source_ckpt}
  output_container_path: ${vars.output_root}

arms:
  d1:
    vars:
      wandb_id: e5gap-d1
      arm_args: ${vars.delay_1}
    stages: &two_segments
      - name: finetune1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.base_args},${vars.arm_args},${vars.seg1_tail}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0,atl1-1-03-014-16-0,atl1-1-03-010-30-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,e5-hardware-gap-10b,${vars.arm},seed${vars.seed},finetune1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: finetune2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.base_args},${vars.arm_args},${vars.seg2_tail}}
        depends_on: finetune1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0,atl1-1-03-014-16-0,atl1-1-03-010-30-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,e5-hardware-gap-10b,${vars.arm},seed${vars.seed},finetune2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
  d2:
    vars:
      wandb_id: e5gap-d2
      arm_args: ${vars.delay_2}
    stages: *two_segments
  g1:
    vars:
      wandb_id: e5gap-g1
      arm_args: ${vars.gain_dr}
    stages: *two_segments
  a1:
    vars:
      wandb_id: e5gap-a1
      arm_args: ${vars.anchor_jitter}
    stages: *two_segments
  r1:
    vars:
      wandb_id: e5gap-r1
      adaptive_uniform_ratio: 0.1
      adaptive_max_over_mean: 200.0
    stages: *two_segments
  h1:
    vars:
      wandb_id: e5gap-h1
      anchor_mode: expert_heading
    stages: *two_segments
  c1:
    vars:
      wandb_id: e5gap-c1
      adaptive_uniform_ratio: 0.1
      adaptive_max_over_mean: 200.0
      # `${concat:}` is not allowed inside vars; the three lists spelled out.
      arm_args:
        - env.actions.joint_pos.delay_substeps_min=0
        - env.actions.joint_pos.delay_substeps_max=1
        - env.events.randomize_actuator_gains.params.stiffness_distribution_params=[0.9,1.1]
        - env.events.randomize_actuator_gains.params.damping_distribution_params=[0.9,1.1]
        - env.expert_macro_anchor_walk_std=0.002
        - env.expert_macro_anchor_walk_max=0.1
        - env.expert_macro_anchor_jitter=0.005
        - env.expert_macro_anchor_jump_prob=0.02
        - env.expert_macro_anchor_jump=0.03
    stages: *two_segments
