  fsq64_hold10:
    vars:
      hold: 10
      command_dim: 66
      phase_mode: sin_cos
      pretrain_mode_args: [--latent_mode, sonic_fsq]
    stages: *default_stages
  # sonic_fsq publishes the quantizer output directly, so --z_dim must equal
  # len(--sonic_fsq_levels); the 64-entry default rejects z_dim=256 (job
