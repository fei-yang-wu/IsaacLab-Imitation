# 2026-09-02 -- LSTM actor on the new default hub (64-D merged, past-5 phi),
# with the optimizer extras, uniform resets, and the action-rate penalty.
#
# User setup (2026-09-02): the `2026-09-01-latent64-probe-10b` `std1` recipe
# with these changes, all of them the new base and not ablated here:
#   * encoder: the past-5 concat phi (`p5_concat`, the default since
#     2026-09-02); `lstm_affine` swaps in the past-5 AFFINE phi (`p5_affine`)
#   * actor: recurrent, `agent.ppo.rnn_hidden_size=256` (normalize/concat ->
#     LSTMModule -> the tuned MLP head, feed-forward critic, [env, T] BPTT
#     minibatches, as in `2026-08-28-smooth-ablation-5b` arm `lstm`)
#   * optimizer: `optim.weight_decay=1e-2`, linear critic lr decay to 1e-5
#     over the frame cap (`_apply_critic_lr_schedule` reads
#     `collector.total_frames` = the segment's own cap, so BOTH segments carry
#     the full 10B cap and the ramp is monotone across the chain)
#   * resets: 100% uniform trajectory with a uniform first-half start frame
#     (`random80_adaptive20` with `random_trajectory_sampling_ratio=1.0`, so
#     the adaptive failure sampler never draws); termination curriculum
#     5M-30M as in std1
#   * envs: 16,384 -- the LSTM's BPTT activation memory OOMs at 20,480 with a
#     widened actor input (2026-08-27 hist, 2026-09-01 obs_hist); the count
#     the `smooth-ablation-5b` lstm ran at. All three arms share it.
#   * rewards: motion_ee_pos 1.0, motion_global_anchor_pos_wide 1.0,
#     tracking_reward_points 4.0, action_rate_l2 -0.03
#
# Arms: `lstm` (10B, two chained 15:59 segments), `lstm_affine` (10B, the
# affine phi), `lstm_nophase` (500M, one segment: does the no-phase stall of
# `latent64-probe-10b` reproduce with a recurrent actor and this recipe).
name: lstm-hub64-10b
profile: ice
wandb_project: g1-bs-pareto
wandb_group: lstm-hub64-10b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  agent_entry: rlopt_ipmd_tuned_fullbatch_cfg_entry_point

  z_dim: 64
  command_dim: 66
  code_latent_dim: 64
  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  command_mode: z
  encoder_ckpt: /data/past_chunk_affine_64d/p5_concat_seed0/encoder/checkpoints/latest.pt

  train_num_envs: 16384
  rollout_steps: 24
  frame_cap: 10000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/lstm_hub64_10b/${vars.arm}_seed${vars.seed}

  optim_args:
    - agent.optim.weight_decay=1.0e-2
    - agent.ipmd.critic_lr_schedule=linear
    - agent.ipmd.critic_lr_final=1.0e-5

  actor_args:
    - agent.ppo.rnn_hidden_size=256

  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03

  # 100% uniform: the preset's random-trajectory branch at ratio 1.0, so the
  # SONIC adaptive failure sampler never draws. Curriculum as in std1.
  select_uniform:
    - env.command_interface.reference.selection=random80_adaptive20
    - env.command_interface.reference.selection.random_trajectory_sampling_ratio=1.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - ${vars.agent_entry}
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-pareto
    - agent.logger.group_name=lstm-hub64-10b
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

  # The resume keeps the full cap (the critic ramp and the budget both read
  # it); the curriculum is over by 30M, so it is off here as in past-chunk.
  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
    - ${vars.encoder_ckpt}
  output_container_path: ${vars.output_root}

arms:
  lstm:
    vars:
      wandb_id: lh64-lstm
    stages: &two_segments
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.actor_args},${vars.select_uniform},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,lstm-hub64,${vars.arm},seed${vars.seed},lowlevel1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.actor_args},${vars.select_uniform},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,lstm-hub64,${vars.arm},seed${vars.seed},lowlevel2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # The past-5 AFFINE phi (phi(s, z) affine in z, exact interpolation in the
  # linear-closure program); pretrain COMPLETED 2026-08-31, tracker never ran.
  lstm_affine:
    vars:
      wandb_id: lh64-lstmaff
      encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
    stages: *two_segments

  # Does the no-phase stall reproduce on this recipe? 500M is enough: the
  # 2026-09-01 stall separates from the control by 60-100M (ep_len 28 vs 62).
  lstm_nophase:
    vars:
      wandb_id: lh64-lstmnop
      phase_mode: none
      command_dim: 64
      frame_cap: 500000000
    stages:
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.actor_args},${vars.select_uniform},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        time_limit: "06:00:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,lstm-hub64,${vars.arm},seed${vars.seed},lowlevel1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
