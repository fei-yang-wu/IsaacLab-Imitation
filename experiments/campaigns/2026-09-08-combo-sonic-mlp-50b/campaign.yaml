# Frozen combo teacher -> 400M DAgger -> SONIC-sized actor, 50B PPO.
name: combo-sonic-mlp-50b
profile: ice
wandb_project: g1-bs-pareto
wandb_group: combo-sonic-mlp-50b
vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  agent_entry: rlopt_ipmd_tuned_fullbatch_cfg_entry_point
  z_dim: 64
  command_dim: 66
  code_latent_dim: 64
  window_mode: intermediate
  macro_terms: '[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]'
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  command_mode: z
  encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
  train_num_envs: 16384
  rollout_steps: 24
  frame_cap: 50000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/combo_sonic_mlp_50b/${vars.arm}_seed${vars.seed}
  optim_args:
  - agent.optim.weight_decay=1.0e-2
  - agent.ipmd.critic_lr_schedule=linear
  - agent.ipmd.critic_lr_final=1.0e-5
  history_args:
  - env.observations.policy.projected_gravity.history_length=10
  - env.observations.policy.base_ang_vel.history_length=10
  - env.observations.policy.joint_pos_rel.history_length=10
  - env.observations.policy.joint_vel_rel.history_length=10
  - env.observations.policy.last_action.history_length=10
  reward_args:
  - env.rewards.motion_ee_pos.weight=1.0
  - env.rewards.motion_global_anchor_pos_wide.weight=1.0
  - env.rewards.action_rate_l2.weight=-0.03
  select_ramp1:
  - env.command_interface.reference.selection=sonic
  - env.command_interface.reference.selection.adaptive_uniform_ratio=0.8
  - env.command_interface.reference.selection.adaptive_uniform_ratio_final=0.5
  - env.command_interface.reference.selection.adaptive_ratio_ramp_frames=4000000000
  - env.enable_termination_curriculum=true
  - env.termination_curriculum_start_frames=5000000
  - env.termination_curriculum_end_frames=30000000
  select_ramp2:
  - env.command_interface.reference.selection=sonic
  - env.command_interface.reference.selection.adaptive_uniform_ratio=0.5
  - env.command_interface.reference.selection.adaptive_uniform_ratio_final=0.2
  - env.command_interface.reference.selection.adaptive_ratio_ramp_frames=4000000000
  - env.enable_termination_curriculum=false
  select_hold:
  - env.command_interface.reference.selection=sonic
  - env.command_interface.reference.selection.adaptive_uniform_ratio=0.2
  - env.command_interface.reference.selection.adaptive_uniform_ratio_final=null
  - env.enable_termination_curriculum=false
  lowlevel_head:
  - --task
  - ${vars.task}
  - --algo
  - IPMD
  - --agent
  - ${vars.agent_entry}
  - --num_envs
  - ${vars.train_num_envs}
  - --seed
  - ${vars.seed}
  - --headless
  - --assert-kitless
  - --max_iterations
  - ${vars.max_iterations}
  - agent.logger.log_dir=${vars.output_root}/tracker
  - agent.logger.backend=wandb
  - agent.logger.video=false
  - agent.logger.project_name=g1-bs-pareto
  - agent.logger.group_name=combo-sonic-mlp-50b
  - env.command_interface.actor=latent
  - env.command_interface.actor.dim=${vars.command_dim}
  - env.command_interface.encoder=single
  - agent.ipmd.latent_dim=${vars.command_dim}
  - agent.ipmd.command_source=hl_skill
  - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
  - agent.ipmd.hl_skill_horizon_steps=10
  - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
  - agent.ipmd.hl_skill_finetune_enabled=false
  - agent.ipmd.latent_steps_min=${vars.hold}
  - agent.ipmd.latent_steps_max=${vars.hold}
  - agent.ipmd.latent_learning.code_period=${vars.hold}
