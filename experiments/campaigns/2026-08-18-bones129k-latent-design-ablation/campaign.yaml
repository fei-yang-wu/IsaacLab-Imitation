# Controlled 2 x 2 BONES-SEED latent-method ablation:
#
#   objective: endpoint DiffSR spectral objective | window reconstruction
#   bottleneck: continuous 256-D                | SONIC FSQ 64 x 32
#
# Every arm uses the same root_qpos encoder input, hold 10, offline pretrain,
# frozen encoder, low-level recipe, data, and 10B-frame budget. This avoids the
# confound in the old online autoencoder runs, where objective, update schedule,
# input width, and encoder freezing all changed together.
name: bones129k-latent-design-ablation
profile: ice
wandb_project: g1-bones-seed
# Proposed functional group. Confirm this name before submit.
wandb_group: latent-design-ablation

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  wandb_id: lda-arm
  objective: endpoint
  objective_tag: spectral
  z_dim: 256
  command_dim: 258
  latent_mode: deterministic
  bottleneck_tag: continuous
  hold: 10
  stride: 1
  anchor_mode: robot_heading
  phase_mode: sin_cos

  pretrain_updates: 50000
  pretrain_batch_size: 8192
  train_num_envs: 16384
  rollout_steps: 24
  # Every walltime segment receives the full global target. The resume
  # checkpoint carries cumulative_env_frames, so the chain stops at this cap.
  frame_cap: 10000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/bones_latent_ablation/${vars.arm}_seed${vars.seed}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker
  seg3_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker
  seg4_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"
    - "env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  pretrain_args:
    - --task
    - ${vars.task}
    - --num_envs
    - "16"
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --output_dir
    - ${vars.output_root}/encoder
    - --logger_backend
    - wandb
    - --wandb_project
    - g1-bones-seed
    - --wandb_group
    - latent-design-ablation
    - --wandb_run_name
    - ${vars.wandb_arm}-pretrain-s${vars.seed}
    - --horizon_steps
    - "10"
    - --encoder_window_mode
    - intermediate
    - --transition_objective
    - ${vars.objective}
    - --latent_mode
    - ${vars.latent_mode}
    - --z_dim
    - ${vars.z_dim}
    - --encoder_hidden_dims
    - "2048"
    - "1024"
    - "512"
    - "512"
    - --encoder_activation
    - silu
    - --no_encoder_layer_norm
    - --diffsr_feature_dim
    - "256"
    - --diffsr_embed_dim
    - "1024"
    - --diffsr_g_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --diffsr_mu_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - "1000"
    - --eval_batches
    - "4"

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=latent-design-ablation
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.output_root}/encoder/checkpoints/latest.pt
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=z
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.z_dim}
    - agent.ipmd.hl_skill_finetune_enabled=false

  tuned_lowlevel:
    - env.rewards.action_rate_l2.weight=0.0
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.command_interface.reference.selection=random80_adaptive20
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - "agent.policy.num_cells=[2048,2048,1024,1024,512,512]"
    - "agent.value_function.num_cells=[2048,2048,1024,1024,512,512]"
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  output_container_path: /data/bones_latent_ablation/${vars.arm}_seed${vars.seed}

arms:
  spectral_cont256:
    vars:
      objective: endpoint
      objective_tag: spectral
      latent_mode: deterministic
      bottleneck_tag: continuous
      z_dim: 256
      command_dim: 258
      wandb_id: lda-sc256
    stages: &ablation_stages
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_args},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent-design-ablation,${vars.objective_tag},${vars.bottleneck_tag},seed${vars.seed},pretrain
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        depends_on: pretrain
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent-design-ablation,${vars.arm},seed${vars.seed},lowlevel,segment1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent-design-ablation,${vars.arm},seed${vars.seed},lowlevel,segment2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel3
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg3_args}}
        depends_on: lowlevel2
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent-design-ablation,${vars.arm},seed${vars.seed},lowlevel,segment3
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel4
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_lowlevel},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg4_args}}
        depends_on: lowlevel3
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent-design-ablation,${vars.arm},seed${vars.seed},lowlevel,segment4
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  spectral_fsq64:
    vars:
      objective: endpoint
      objective_tag: spectral
      latent_mode: sonic_fsq
      bottleneck_tag: fsq
      z_dim: 64
      command_dim: 66
      wandb_id: lda-sf64
    stages: *ablation_stages

  recon_cont256:
    vars:
      objective: reconstruction
      objective_tag: reconstruction
      latent_mode: deterministic
      bottleneck_tag: continuous
      z_dim: 256
      command_dim: 258
      wandb_id: lda-rc256
    stages: *ablation_stages

  recon_fsq64:
    vars:
      objective: reconstruction
      objective_tag: reconstruction
      latent_mode: sonic_fsq
      bottleneck_tag: fsq
      z_dim: 64
      command_dim: 66
      wandb_id: lda-rf64
    stages: *ablation_stages
