# 2026-09-02 -- every live arm scored at its LATEST checkpoint.
#
# `eval_checkpoint_tree.py --final_only` on each arm's real trainer tree, so
# the row is whatever the deepest `model_step_*.pt` is when the job starts
# (the trees of the still-training arms keep growing). Board, row,
# randomization, and evaluator arguments are the star-v2 curves protocol
# verbatim, as in `2026-09-01-latent64-probe-3b-eval`.
#
# Arms and what they bind:
#   latent64-probe-10b: z64_merged (control, 9.5B), enc_hist (p5_concat,
#     9.5B), obs_hist (ten-step actor history, 8.5B), z64_wd_clin (weight
#     decay + critic decay, 7B+)
#   lstm-hub64-10b: lstm (recurrent actor, p5_concat, 4.5B+), lstm_affine
#     (recurrent actor, p5_affine, 4.5B+). Both pass
#     `agent.ppo.rnn_hidden_size=256` so the evaluator builds the same actor.
#     The recurrent-state carry in `evaluate_checkpoint` is the qualification
#     debt noted in `2026-08-28-smooth-ablation-5b`: the step loop is
#     `policy(td); step_mdp(td)`, which carries `("next", recurrent_state_*)`
#     forward, and the smooth-ablation lstm row (0.9229 at 5B) came through
#     it, but nobody has checked the reset-time zeroing in the evaluator.
name: latest-eval
profile: ice
wandb_project: g1-bs-pareto
wandb_group: latest-eval

vars:
  tree_root: /data/latent64_probe_10b
  # The tracker this job scores; the control plane forces `vars.arm` to the
  # ARM NAME, so a `*_robust` arm sets `eval_arm` to the tracker it scores
  # and the output row keeps the tracker's name.
  eval_arm: ${vars.arm}
  tree: ${vars.tree_root}/${vars.eval_arm}_seed${vars.seed}
  eval_root: /data/eval/latest_eval
  actor_args: []
  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  encoder_ckpt: /data/latent_star_v2/hub_seed0/encoder/checkpoints/latest.pt
  # `clean` is --randomization none; `robust` is the campaign board's
  # robustness partner, --randomization no_push (startup and reset
  # randomization on, no push), as in 2026-08-28-smooth-ablation-5b/eval.sh.
  row: clean
  randomization: none
  history_args: []

  head:
    - --tree
    - ${vars.tree}
    - --output_root
    - ${vars.eval_root}
    - --arm
    - ${vars.eval_arm}
    - --seed
    - ${vars.seed}
    - --row
    - ${vars.row}
    - --board
    - bones_testbed4096_v1
    - --final_only
    - "--"
    - --task
    - Isaac-Imitation-G1-v2
    - --algo
    - IPMD
    - --agent_entry_point
    - rlopt_ipmd_tuned_cfg_entry_point
    - --randomization
    - ${vars.randomization}
    - --action_sampling
    - mode
    - --steps
    - "10000"
    - --seed
    - ${vars.seed}
    - --reference_start_frame
    - "0"
    - --reset_schedule
    - sequential
    - --skill_encoder_source
    - pretrained
    - --headless
    - physics=newton_mjwarp
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - env.events.push_robot=null
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cuda:0
    - env.data.reference_prefetch_mode=off
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]

  interface:
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=66
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=66
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=z
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=1
    - agent.ipmd.latent_steps_max=1
    - agent.ipmd.latent_learning.code_period=1
    - agent.ipmd.latent_learning.command_phase_mode=sin_cos
    - agent.ipmd.latent_learning.command_phase_source=hold
    - agent.ipmd.latent_learning.command_phase_period=0
    - agent.ipmd.latent_learning.code_latent_dim=64
    - env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]
    - env.expert_macro_frame_stride=1
    - env.expert_macro_anchor_mode=robot_heading

  board_terms:
    - env.terminations.anchor_pos.params.threshold=0.25
    - env.terminations.anchor_pos.params.down_threshold=0.25
    - env.terminations.anchor_ori.params.threshold=1.0
    - env.terminations.ee_body_pos.params.threshold=0.25
    - env.terminations.ee_body_pos.params.down_threshold=0.25
    - env.terminations.foot_pos_xyz=null
    - env.terminations.base_too_low=null
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.activation_fn=silu

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
    - ${vars.encoder_ckpt}
    - ${vars.tree}/tracker
  output_container_path: ${vars.eval_root}

arms:
  z64_merged:
    vars: {}
    stages: &score_stages
      - name: score
        executable: scripts/rlopt/eval_checkpoint_tree.py
        args: ${concat:${vars.head},${vars.interface},${vars.actor_args},${vars.history_args},${vars.board_terms}}
        time_limit: "02:00:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_ISAAC_SIM_CACHE_DIR: /storage/ice-shared/vip-vwt/scratch-fwu91/isaac_cache_curves/latest_${vars.arm}

  enc_hist:
    vars:
      encoder_ckpt: /data/past_chunk_affine_64d/p5_concat_seed0/encoder/checkpoints/latest.pt
    stages: *score_stages

  obs_hist:
    vars:
      history_args:
        - env.observations.policy.projected_gravity.history_length=10
        - env.observations.policy.base_ang_vel.history_length=10
        - env.observations.policy.joint_pos_rel.history_length=10
        - env.observations.policy.joint_vel_rel.history_length=10
        - env.observations.policy.last_action.history_length=10
    stages: *score_stages

  z64_wd_clin:
    vars: {}
    stages: *score_stages

  lstm:
    vars:
      tree_root: /data/lstm_hub64_10b
      encoder_ckpt: /data/past_chunk_affine_64d/p5_concat_seed0/encoder/checkpoints/latest.pt
      actor_args:
        - agent.ppo.rnn_hidden_size=256
    stages: *score_stages

  lstm_affine:
    vars:
      tree_root: /data/lstm_hub64_10b
      encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
      actor_args:
        - agent.ppo.rnn_hidden_size=256
    stages: *score_stages

  # The stacked arm (weight decay + critic decay + past-5 affine encoder +
  # ten-step actor history, MLP actor), latent64-probe-10b, 10B in two
  # segments (2026-09-03).
  combo:
    vars:
      encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
      history_args:
        - env.observations.policy.projected_gravity.history_length=10
        - env.observations.policy.base_ang_vel.history_length=10
        - env.observations.policy.joint_pos_rel.history_length=10
        - env.observations.policy.joint_vel_rel.history_length=10
        - env.observations.policy.last_action.history_length=10
    stages: *score_stages

  # ---- Robust rows on the finished 10B checkpoints (2026-09-03): the
  # ---- board's robustness partner, `--randomization no_push`, on the same
  # ---- boards and trees as the clean rows above. The clean rows are
  # ---- lstm 0.9121 / lstm_affine 0.9062 / combo 0.9214.
  lstm_robust:
    vars:
      eval_arm: lstm
      tree_root: /data/lstm_hub64_final
      encoder_ckpt: /data/past_chunk_affine_64d/p5_concat_seed0/encoder/checkpoints/latest.pt
      actor_args:
        - agent.ppo.rnn_hidden_size=256
      row: robust
      randomization: no_push
    stages: *score_stages

  lstm_affine_robust:
    vars:
      eval_arm: lstm_affine
      tree_root: /data/lstm_hub64_final
      encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
      actor_args:
        - agent.ppo.rnn_hidden_size=256
      row: robust
      randomization: no_push
    stages: *score_stages

  combo_robust:
    vars:
      eval_arm: combo
      tree_root: /data/latent64_probe_final
      encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
      history_args:
        - env.observations.policy.projected_gravity.history_length=10
        - env.observations.policy.base_ang_vel.history_length=10
        - env.observations.policy.joint_pos_rel.history_length=10
        - env.observations.policy.joint_vel_rel.history_length=10
        - env.observations.policy.last_action.history_length=10
      row: robust
      randomization: no_push
    stages: *score_stages

  # ---- Mid-flight rows on the two live chains (2026-09-03). `--final_only`
  # ---- takes whatever the deepest checkpoint is when the job starts, so
  # ---- these are "where the run stands now" rows, not final ones. Both
  # ---- trees still hold a single run directory, so no milestone-layout
  # ---- symlink is needed yet; after their first resume they will.
  combo50b_live:
    vars:
      eval_arm: combo
      tree_root: /data/combo_50b
      encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
      history_args:
        - env.observations.policy.projected_gravity.history_length=10
        - env.observations.policy.base_ang_vel.history_length=10
        - env.observations.policy.joint_pos_rel.history_length=10
        - env.observations.policy.joint_vel_rel.history_length=10
        - env.observations.policy.last_action.history_length=10
    stages: *score_stages

  # Final 10B row (2026-09-04): the run wrote two run directories across its
  # resume, so the eval reads the milestone-layout symlink tree.
  lstm_affine_std_final:
    vars:
      eval_arm: lstm_affine_std
      tree_root: /data/lstm_hub64_final
      encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
      actor_args:
        - agent.ppo.rnn_hidden_size=256
    stages: *score_stages

  lstm_affine_std_robust:
    vars:
      eval_arm: lstm_affine_std
      tree_root: /data/lstm_hub64_final
      encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
      actor_args:
        - agent.ppo.rnn_hidden_size=256
      row: robust
      randomization: no_push
    stages: *score_stages

  lstm_affine_std_live:
    vars:
      eval_arm: lstm_affine_std
      tree_root: /data/lstm_hub64_10b
      encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt
      actor_args:
        - agent.ppo.rnn_hidden_size=256
    stages: *score_stages
