  # ---- Budget-axis curves for the 64-D merged-head family (2026-09-12).
  # ---- Control `z64_merged` plus the two 2026-09-11 arms: `z64_merged_noreg`
  # ---- (no SIGReg, no latent L2) and `z64_poe` (<z, E(s, s')> score, no
  # ---- regularizer, past-five source). Each scores every unscored 500M
  # ---- checkpoint from a milestone-layout live tree that
  # ---- 2026-09-12-latent64-probe-live-eval/submit_live_eval.sh relinks, so a
  # ---- resume's second run directory can never raise `AmbiguousTree`.
  # ---- The encoder file differs per arm; the tracker interface is z64_merged's.
  z64_merged_curve:
    vars:
      eval_arm: z64_merged
      tree_root: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_live
    stages: &curve_stages
      - name: score
        executable: scripts/rlopt/eval_checkpoint_tree.py
        args: ${concat:${vars.curve_head},${vars.interface},${vars.actor_args},${vars.history_args},${vars.critic_args},${vars.board_terms}}
        time_limit: "03:30:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0,atl1-1-03-014-16-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_ISAAC_SIM_CACHE_DIR: /storage/ice-shared/vip-vwt/scratch-fwu91/isaac_cache_curves/latest_${vars.arm}

  z64_merged_noreg_curve:
    vars:
      eval_arm: z64_merged_noreg
      tree_root: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_live
      encoder_ckpt: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_10b/z64_merged_noreg_seed0/encoder/checkpoints/latest.pt
    stages: *curve_stages

  z64_poe_curve:
    vars:
      eval_arm: z64_poe
      tree_root: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_live
      encoder_ckpt: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_10b/z64_poe_seed0/encoder/checkpoints/latest.pt
    stages: *curve_stages

  # ---- The rest of the PoE family (2026-09-12). `z64_poe_base` adds the
  # ---- constant base channel; the width-ablation arms untie the expert count
  # ---- from the latent width. Only `poe_z256` changes the COMMAND, so it
  # ---- carries its own interface block: 258 wide, code_latent_dim 256.
  z64_poe_base_curve:
    vars:
      eval_arm: z64_poe_base
      tree_root: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_live
      encoder_ckpt: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_10b/z64_poe_base_seed0/encoder/checkpoints/latest.pt
    stages: *curve_stages

  poe_proj256_curve:
    vars:
      eval_arm: poe_proj256
      tree_root: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_live
      encoder_ckpt: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_10b/poe_proj256_seed0/encoder/checkpoints/latest.pt
    stages: *curve_stages

  poe_proj256_base_curve:
    vars:
      eval_arm: poe_proj256_base
      tree_root: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_live
      encoder_ckpt: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_10b/poe_proj256_base_seed0/encoder/checkpoints/latest.pt
    stages: *curve_stages

  poe_z256_curve:
    vars:
      eval_arm: poe_z256
      tree_root: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_live
      encoder_ckpt: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_10b/poe_z256_seed0/encoder/checkpoints/latest.pt
      interface:
        - env.command_interface.actor=latent
        - env.command_interface.actor.dim=258
        - env.command_interface.encoder=single
        - agent.ipmd.latent_dim=258
        - agent.ipmd.command_source=hl_skill
        - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
        - agent.ipmd.hl_skill_horizon_steps=10
        - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
        - agent.ipmd.hl_skill_finetune_enabled=false
        - agent.ipmd.latent_steps_min=1
        - agent.ipmd.latent_steps_max=1
        - agent.ipmd.latent_learning.code_period=1
        - agent.ipmd.latent_learning.command_phase_mode=sin_cos
        - agent.ipmd.latent_learning.command_phase_source=hold
        - agent.ipmd.latent_learning.command_phase_period=0
        - agent.ipmd.latent_learning.code_latent_dim=256
        - env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]
        - env.expert_macro_frame_stride=1
        - env.expert_macro_anchor_mode=robot_heading
    stages: *curve_stages

  # ---- The regularizer-ON partners (2026-09-12-poe-reg-ablation). Same
  # ---- 66-wide command as every 64-D PoE arm, so the shared interface block
  # ---- applies unchanged; only the encoder file differs.
