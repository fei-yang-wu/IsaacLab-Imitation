      tree_root: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_live
      encoder_ckpt: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_10b/poe_proj256_reg_seed0/encoder/checkpoints/latest.pt
