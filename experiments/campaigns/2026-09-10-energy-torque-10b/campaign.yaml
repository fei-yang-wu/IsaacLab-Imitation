# 2026-09-10 -- energy / torque penalty fine-tunes, 10B each, two hubs
# (user request 2026-09-10).
#
# Motivation: on the plant and on hardware our trackers drive ankles and knees
# with far larger target excursions than SONIC (ankle target step p99 0.42 rad
# for action01 55B against 0.16 for sonic_v1_1; targets past the joint range
# on 271 of 1375 ticks of macarena). The PD gains are identical to SONIC's, so
# the stiffness is in the commanded targets. SONIC's released training config
# (/mnt/hsstorage/fwu91/sonic_v1_1/config.yaml) carries a whole-body
# mechanical-power penalty `energy_consumption` (|tau * qvel| summed) at
# -1.0e-4 that every combo/action01 arm ran WITHOUT (weight 0.0 since the
# 2026-08-28 port). `joint_torques_l2` (squared applied torque, all joints,
# isaaclab's term) is our own addition, not a SONIC term; -1.0e-5 is a first
# weight, chosen so a whole-body sum of order 1e4 N^2 m^2 costs about as much
# per step as the action-rate penalty.
#
# Two hubs, each continued for exactly 10B frames past its checkpoint; every
# other argument is the hub's own command.txt verbatim, including its
# action_rate_l2 weight:
#
#   hub action01 (rate -0.1): 55,500,079,104 -> 65,500,079,104
#   hub action01rate05 (rate -0.5): 60,000,043,008 -> 70,000,043,008
#
#   e1  action01   + energy_consumption -1.0e-4
#   e5  rate05     + energy_consumption -1.0e-4
#   t1  action01   + joint_torques_l2   -1.0e-5
#   t5  rate05     + joint_torques_l2   -1.0e-5
#
# Two chained 15:59 segments per arm (about 8.6B each at 150k fps). Segment
# 1 starts from the hub's checkpoint FILE; segment 2 resumes from the arm's
# own tree so `cumulative_env_frames` carries. Same W&B group as the
# smoothness ablation.
name: energy-torque-10b
profile: ice
wandb_project: g1-bs-pareto
wandb_group: combo50b-smooth-ablation

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  agent_entry: rlopt_ipmd_tuned_fullbatch_cfg_entry_point

  train_num_envs: 16384
  rollout_steps: 24
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  # Per arm: hub checkpoint + 10B. Overridden in each arm's vars.
  frame_cap: 0
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  action_rate_weight: 0.0
  source_ckpt: ""
  penalty_args: []

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  hub_action01: /data/combo_action01_continue10b/action01_seed0/tracker/2026-09-09_08-28-18_wandb-c50bsft-action01-s0-fe278a/models/model_step_55500079104.pt
  hub_rate05: /data/combo_action01_rate05_60000043008_pinned_20260909/action01rate05_seed0/tracker/f60000043008/models/model_step_60000043008.pt
  output_root: /data/energy_torque_10b/${vars.arm}_seed${vars.seed}
  encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt

  energy_penalty:
    - env.rewards.energy_consumption.weight=-1.0e-4
  torque_penalty:
    - env.rewards.joint_torques_l2.weight=-1.0e-5

  base_args:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - ${vars.agent_entry}
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-pareto
    - agent.logger.group_name=combo50b-smooth-ablation
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=66
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=66
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=z
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=1
    - agent.ipmd.latent_steps_max=1
    - agent.ipmd.latent_learning.code_period=1
    - agent.ipmd.latent_learning.command_phase_mode=sin_cos
    - agent.ipmd.latent_learning.code_latent_dim=64
    - env.rewards.tracking_reward_points.weight=4.0
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=${vars.action_rate_weight}
    - agent.optim.weight_decay=1.0e-2
    - agent.ipmd.critic_lr_schedule=constant
    - agent.ipmd.critic_lr_final=1.0e-5
    - env.observations.policy.projected_gravity.history_length=10
    - env.observations.policy.base_ang_vel.history_length=10
    - env.observations.policy.joint_pos_rel.history_length=10
    - env.observations.policy.joint_vel_rel.history_length=10
    - env.observations.policy.last_action.history_length=10
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.2
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=null
    - env.data.reference_prefetch_mode=next
    - env.enable_termination_curriculum=false
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu
    - agent.ppo.update_normalizers_after_rollout=false
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]
    - env.expert_macro_frame_stride=1
    - env.expert_macro_anchor_mode=robot_heading
  seg1_tail:
    - --checkpoint
    - ${vars.source_ckpt}
  seg2_tail:
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
    - ${vars.encoder_ckpt}
    - ${vars.source_ckpt}
  output_container_path: ${vars.output_root}

arms:
  e1:
    vars:
      wandb_id: smooth-e1
      source_ckpt: ${vars.hub_action01}
      action_rate_weight: -0.1
      frame_cap: 65500079104
      penalty_args: ${vars.energy_penalty}
    stages: &two_segments
      - name: finetune1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.base_args},${vars.penalty_args},${vars.seg1_tail}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0,atl1-1-03-014-16-0,atl1-1-03-010-30-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,energy-torque-10b,${vars.arm},seed${vars.seed},finetune1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: finetune2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.base_args},${vars.penalty_args},${vars.seg2_tail}}
        depends_on: finetune1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0,atl1-1-03-014-16-0,atl1-1-03-010-30-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,energy-torque-10b,${vars.arm},seed${vars.seed},finetune2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
  e5:
    vars:
      wandb_id: smooth-e5
      source_ckpt: ${vars.hub_rate05}
      action_rate_weight: -0.5
      frame_cap: 70000043008
      penalty_args: ${vars.energy_penalty}
    stages: *two_segments
  t1:
    vars:
      wandb_id: smooth-t1
      source_ckpt: ${vars.hub_action01}
      action_rate_weight: -0.1
      frame_cap: 65500079104
      penalty_args: ${vars.torque_penalty}
    stages: *two_segments
  t5:
    vars:
      wandb_id: smooth-t5
      source_ckpt: ${vars.hub_rate05}
      action_rate_weight: -0.5
      frame_cap: 70000043008
      penalty_args: ${vars.torque_penalty}
    stages: *two_segments
