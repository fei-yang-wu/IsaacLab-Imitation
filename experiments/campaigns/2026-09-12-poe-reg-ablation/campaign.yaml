# 2026-09-12 -- the PoE family WITH the latent regularizers, the matched
# partner of every regularizer-off arm. Four arms, one seed each, 10B.
#
# The five running PoE arms all turned SIGReg and the latent L2 off, so
# "product-of-experts score" and "no regularizer" are confounded in every one
# of them. These four restore the hub defaults (`--jepa_sigreg_coeff` 1.0,
# `--reg_coeff` 1e-3) and change nothing else, giving a matched partner for
# each 64-D-command arm:
#
#   this arm               partner (reg off)   phi          experts  base
#   z64_poe_reg            z64_poe             z                 64  no
#   z64_poe_base_reg       z64_poe_base        [1; z]        64 + 1  yes
#   poe_proj256_reg        poe_proj256         A z              256  no
#   poe_proj256_base_reg   poe_proj256_base    [1; A z]     255 + 1  yes
#
# `poe_z256` has no partner here on purpose: it is the only arm whose command
# changes (258 against 66), so a regularizer contrast on it would move two
# things at once against everything else in the family.
#
# Why this matters for the reading. `z64_merged_noreg` against `z64_merged`
# showed the regularizers are worth under 0.01 success rate on the concat
# head at matched frames. Whether that holds for phi = z is a separate
# question: with `phi = z` and no regularizer nothing pins the scale of the
# latent against the scale of E, and the regularizer-off PoE pretrain ended
# with a latent std of 0.17 against the hub's 1.01. These arms measure what
# that costs, if anything.
#
# Everything else is the width-ablation campaign verbatim: merged diff_chunk
# head, boundary_next, endpoint coefficient 0, pair-conditioned mu,
# past-five source, 50,000 updates at batch 8,192, then the `z64_merged` 10B
# tracker stage (20,480 x 24, random80_adaptive20, 5M-30M curriculum,
# ee + wide rewards, action_rate_l2 -0.03, full-batch entry point, a
# checkpoint every 500M). Fresh pretrain per arm, so each pairing also
# carries encoder-init noise (0.0064 SR / 0.46 mm / 10.8 mm,
# 2026-08-30-encoder-interface-500m).
#
# Output on ice-shared (404 GB free at submission).
name: poe-reg-ablation
profile: ice
wandb_project: g1-bs-pareto
wandb_group: latent64-probe-10b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  wandb_id: l64p-z64poe-base
  submit_seed: 0
  agent_entry: rlopt_ipmd_tuned_fullbatch_cfg_entry_point

  # --- Encoder: the hub recipe with both regularizers at zero ---
  objective: jepa_ntp
  objective_args:
    - --jepa_loss
    - sigreg_ebm
    - --jepa_ntp_head
    - diff_chunk
    - --jepa_ntp_chunk_span
    - boundary_next
    - --jepa_endpoint_coeff
    - "0"
    - --diffsr_phi_parameterization
    - ${vars.phi_parameterization}
    - --diffsr_mu_conditioning
    - pair
    # Regularizers at the hub defaults: SIGReg 1.0, latent L2 1e-3. This is
    # the ONLY difference from the matching arm in 2026-09-12-poe-width-ablation
    # / 2026-09-11-poe-z64-10b / 2026-09-12-poe-base-z64-10b.
    # phi's source is the past-five chunk plus the current state (6 x 380 =
    # 2,280 wide), as in the p5_* encoders under combo-50b; the pair-conditioned
    # mu sees the same 2,280-wide source.
    - --source_history_steps
    - "5"
    - --source_anchor
    - current
  latent_mode: deterministic
  ln_args: ["--encoder_layer_norm"]
  window_mode: intermediate
  horizon: 10
  phi_parameterization: linear
  feature_dim: "256"
  z_dim: 64
  command_dim: 66
  code_latent_dim: 64
  pretrain_updates: 50000
  pretrain_batch_size: 8192

  # --- Interface (the control's) ---
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  command_mode: z

  # --- Tracker scale: 20,480 x 24 = 491,520 frames per batch, 10B ---
  train_num_envs: 20480
  rollout_steps: 24
  frame_cap: 10000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /storage/ice-shared/vip-vwt/scratch-fwu91/latent64_probe_10b/${vars.arm}_seed${vars.seed}
  encoder_ckpt: ${vars.output_root}/encoder/checkpoints/latest.pt

  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03

  select_std:
    - env.command_interface.reference.selection=random80_adaptive20
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"
    - "env.expert_macro_state_terms=${vars.macro_terms}"
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  pretrain_head:
    - --task
    - ${vars.task}
    - --num_envs
    - "16"
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --output_dir
    - ${vars.output_root}/encoder
    - --logger_backend
    - wandb
    - --wandb_project
    - g1-bs-pareto
    - --wandb_group
    - latent64-probe-10b
    - --wandb_run_name
    - ${vars.wandb_arm}-pretrain-s${vars.seed}
    - --horizon_steps
    - ${vars.horizon}
    - --encoder_window_mode
    - ${vars.window_mode}
    - --transition_objective
    - ${vars.objective}
    - --latent_mode
    - ${vars.latent_mode}
    - --z_dim
    - ${vars.z_dim}

  pretrain_tail:
    - --encoder_hidden_dims
    - "2048"
    - "1024"
    - "512"
    - "512"
    - --encoder_activation
    - silu
    - --diffsr_feature_dim
    - ${vars.feature_dim}
    - --diffsr_embed_dim
    - "1024"
    - --diffsr_g_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --diffsr_mu_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - "1000"
    - --eval_batches
    - "4"

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - ${vars.agent_entry}
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-pareto
    - agent.logger.group_name=latent64-probe-10b
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
  output_container_path: ${vars.output_root}

arms:
  z64_poe_reg:
    vars:
      wandb_id: l64p-poereg64
      phi_parameterization: identity
      feature_dim: "64"
    stages:
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_head},${vars.objective_args},${vars.ln_args},${vars.pretrain_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-014-16-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent64-probe,${vars.arm},seed${vars.seed},pretrain,poe
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.select_std},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        depends_on: pretrain
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-014-16-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent64-probe,${vars.arm},seed${vars.seed},lowlevel1,poe
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.select_std},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
