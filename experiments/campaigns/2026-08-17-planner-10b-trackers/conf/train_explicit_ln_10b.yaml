defaults:
  - base_train
  - _self_

# The confound-free explicit arm: same rollout states, same rows, same
# optimizer budget and warm start as `train_ln_hold1_10b`; the ONLY change is
# the regression target, `chunk_target` (30 x 38 root_qpos frames) instead of
# `latent_target` (30 x 256 per-step latents). Evaluated through the frozen
# ln_hold1 encoder onto the same 10B tracker, so the planner's output space is
# the single variable.
output_dir: outputs/planner_10b/arms/explicit_ln_10b
target: chunk
data:
  table: outputs/planner_10b/tables/ln_hold1_10b_chunk_table.pt
  state_field: oracle_rollout_state_history
goal_features: outputs/gr00t_language30/goal_features/goal_features.pt
pretrained_bundle: outputs/gr00t_language10/goal_features/action_head_trunk.pt
model:
  state_dropout_prob: 0
run:
  checkpoint_interval: 4000
wandb:
  project: g1-bones-seed-tamp
  name: planner_explicit_ln_10b
  tags: [gr00t-head, planner-10b, explicit, root-qpos-chunk, target-chunk, matched-collection]
