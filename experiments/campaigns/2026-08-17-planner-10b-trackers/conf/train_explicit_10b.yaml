defaults:
  - base_train
  - _self_

# Explicit-interface head for the latent-vs-explicit comparison: identical
# backbone, warm start, optimizer budget, and rows as `train_fsq64_10b` — the
# only change is the regression target, the table's `chunk_target`
# (30 x 38 root_qpos frames) instead of the 3 x 64 latent slots. The table is
# the fsq64_10b collection because it is the one that stored the 30-frame
# expert lookahead; record that the training states were collected under the
# FSQ tracker's rollouts.
output_dir: outputs/planner_10b/arms/explicit_10b
target: chunk
data:
  table: outputs/planner_10b/tables/fsq64_10b_table.pt
  state_field: oracle_rollout_state_history
goal_features: outputs/gr00t_language30/goal_features/goal_features.pt
pretrained_bundle: outputs/gr00t_language10/goal_features/action_head_trunk.pt
model:
  state_dropout_prob: 0
run:
  checkpoint_interval: 4000
wandb:
  project: g1-bones-seed-tamp
  name: planner_explicit_10b
  tags: [gr00t-head, planner-10b, explicit, root-qpos-chunk, target-chunk, language30-v2]
