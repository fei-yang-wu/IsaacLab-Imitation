# 2026-09-10 -- smoothness fine-tune ablation off the action01 55B checkpoint.
#
# Plan of record: Embodied-Control docs/design/smoothness_finetune_plan.md
# (branch dev @ 1e343da), evidence docs/evidence/noise_20260910/{REPORT,DITHER}.md.
# Measured on the G1 plant with the robot's own sensor-noise envelope: the
# commanded ankle target dither is in the POLICY OUTPUT, 2-5x SONIC's
# (action01_55b 0.039 rad vs sonic_v1_1 0.011); deployment PD gains are not the
# lever (kd x1.5 costs 8/43 motions); training observation noise is 20-130x the
# robot's measured envelope.
#
# Every arm continues from the same checkpoint for 2.0B frames and changes
# exactly what its row says:
#
#   source   /data/combo_action01_continue10b/action01_seed0/tracker/
#            2026-09-09_08-28-18_wandb-c50bsft-action01-s0-fe278a/models/
#            model_step_55500079104.pt   (55.5B stands in for the plan's 55B,
#            user 2026-09-10)
#   cap      55,500,079,104 + 2.0B = 57,500,079,104 -> 146,231 iterations
#            at 16,384 x 24
#   a2       action_acc_l2 weight -0.5 (new term, ea2c9cc); action_rate stays -0.1
#   a3       observation noise at 4x the measured envelope:
#            joint_pos +-0.0005, joint_vel +-0.1, gyro +-0.06, projected_gravity
#            +-0.005; rewards as 55B
#   c1       a2 + a3
#   a4/a5/c2/c3  DEFINED BELOW BUT NOT SUBMITTED: they change the action
#            contract (step clip / in-loop EMA) and the plan requires the
#            export manifest and EC's tracker core to carry the same filter
#            first. a5 is config-only (`env.actions.joint_pos.ema_alpha`,
#            mdp/actions.py); a4 needs a step clip added to that term.
#
# Everything else is the 55B run's own command.txt verbatim. The observation
# normalizer stays frozen (`update_normalizers_after_rollout=false`) on EVERY
# arm, the noise arms included, so each row moves one thing (user, 2026-09-10).
# `critic_lr_schedule=constant`, so the raised cap moves no schedule. Resume
# pattern is the 60B continuation's: `--checkpoint <exact file>` into a fresh
# tree, which loads the full state, optimizer included.
name: smooth-ablation-55b
profile: ice
wandb_project: g1-bs-pareto
wandb_group: combo50b-smooth-ablation

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  agent_entry: rlopt_ipmd_tuned_fullbatch_cfg_entry_point

  train_num_envs: 16384
  rollout_steps: 24
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  frame_cap: 57500079104
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  source_ckpt: /data/combo_action01_continue10b/action01_seed0/tracker/2026-09-09_08-28-18_wandb-c50bsft-action01-s0-fe278a/models/model_step_55500079104.pt
  output_root: /data/smooth_ablation_55b/${vars.arm}_seed${vars.seed}
  encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt

  # THE VARIABLES. Empty on the parent; each arm overrides what its row names.
  reward_args: []
  noise_args: []
  action_args: []

  # The plan's A3 envelope, 4x the robot's measured half-ranges.
  noise_4x:
    - env.observations.policy.joint_pos_rel.noise.n_min=-0.0005
    - env.observations.policy.joint_pos_rel.noise.n_max=0.0005
    - env.observations.policy.joint_vel_rel.noise.n_min=-0.1
    - env.observations.policy.joint_vel_rel.noise.n_max=0.1
    - env.observations.policy.base_ang_vel.noise.n_min=-0.06
    - env.observations.policy.base_ang_vel.noise.n_max=0.06
    - env.observations.policy.projected_gravity.noise.n_min=-0.005
    - env.observations.policy.projected_gravity.noise.n_max=0.005
  acc_penalty:
    - env.rewards.action_acc_l2.weight=-0.5

  base_args:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - ${vars.agent_entry}
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-pareto
    - agent.logger.group_name=combo50b-smooth-ablation
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=66
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=66
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=z
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=1
    - agent.ipmd.latent_steps_max=1
    - agent.ipmd.latent_learning.code_period=1
    - agent.ipmd.latent_learning.command_phase_mode=sin_cos
    - agent.ipmd.latent_learning.code_latent_dim=64
    - env.rewards.tracking_reward_points.weight=4.0
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.1
    - agent.optim.weight_decay=1.0e-2
    - agent.ipmd.critic_lr_schedule=constant
    - agent.ipmd.critic_lr_final=1.0e-5
    - env.observations.policy.projected_gravity.history_length=10
    - env.observations.policy.base_ang_vel.history_length=10
    - env.observations.policy.joint_pos_rel.history_length=10
    - env.observations.policy.joint_vel_rel.history_length=10
    - env.observations.policy.last_action.history_length=10
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.2
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=null
    - env.data.reference_prefetch_mode=next
    - env.enable_termination_curriculum=false
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu
    - agent.ppo.update_normalizers_after_rollout=false
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]
    - env.expert_macro_frame_stride=1
    - env.expert_macro_anchor_mode=robot_heading
  tail_args:
    - --checkpoint
    - ${vars.source_ckpt}

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
    - ${vars.encoder_ckpt}
    - ${vars.source_ckpt}
  output_container_path: ${vars.output_root}

arms:
  a2:
    vars:
      wandb_id: smooth-a2
      reward_args: ${vars.acc_penalty}
    stages: &one_segment
      - name: finetune
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.base_args},${vars.reward_args},${vars.noise_args},${vars.action_args},${vars.tail_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0,atl1-1-03-014-16-0,atl1-1-03-010-30-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,smooth-ablation-55b,${vars.arm},seed${vars.seed}
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
  a3:
    vars:
      wandb_id: smooth-a3
      noise_args: ${vars.noise_4x}
    stages: *one_segment
  c1:
    vars:
      wandb_id: smooth-c1
      reward_args: ${vars.acc_penalty}
      noise_args: ${vars.noise_4x}
    stages: *one_segment
  # ---- Held until the action contract lands in the export manifest and EC ----
  a5:
    vars:
      wandb_id: smooth-a5
      action_args:
        - env.actions.joint_pos.ema_alpha=0.4
    stages: *one_segment
  c3:
    vars:
      wandb_id: smooth-c3
      reward_args: ${vars.acc_penalty}
      noise_args: ${vars.noise_4x}
      action_args:
        - env.actions.joint_pos.ema_alpha=0.4
    stages: *one_segment
