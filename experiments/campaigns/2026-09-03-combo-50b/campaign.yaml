# 2026-09-03 -- `combo` promoted to 50B.
#
# The arm scored at 10B in `2026-09-01-latent64-probe-10b` (0.9214 SR /
# 22.64 MPJPE-L / 88.52 MPJPE-G clean, 0.9146 / 24.84 / 124.52 robust, the
# best tracking row of that group), carried to the frame budget of the
# headline chain. Recipe unchanged from that arm:
#
#   * encoder: the past-5 AFFINE phi (`p5_affine`), 64-D merged hub, hold 1,
#     sin_cos phase (constant at hold 1, kept: every no-phase arm stalls)
#   * actor: MLP, ten-step history on the five policy terms; critic single
#     frame
#   * optimizer: full-batch/3-epoch entry point, `optim.weight_decay=1e-2`,
#     linear critic decay to 1e-5 over the 50B cap
#   * resets: `random80_adaptive20` with the 5M-30M termination curriculum
#   * rewards: motion_ee_pos 1.0, motion_global_anchor_pos_wide 1.0,
#     tracking_reward_points 4.0, action_rate_l2 -0.03
#   * 16,384 environments (20,480 OOMs with the widened actor input)
#
# SEVEN chained 15:59 segments, `afterany`, every one carrying the full 50B
# cap (127,157 iterations at 16,384 x 24). At the ~150k fps this arm held on
# `coe-gpu` a segment buys about 8.6B, so six segments reach the cap and the
# seventh is slack for a slow node.
#
# DISK: `agent.save_interval=1000000000` (1B, not the 500M of the 10B
# campaigns): 50 checkpoints x 244 MB = 12.2 GB. The ICE home quota was at
# 265 GB of 300 GB when this was submitted, so the 500M interval would not
# have fit.
name: combo-50b
profile: ice
wandb_project: g1-bs-pareto
wandb_group: combo-50b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}

  # Tracker agent entry point. `nophase_linlr` swaps it for the linear-lr
  # variant (2026-09-01); every other arm keeps the promoted full-batch one.
  agent_entry: rlopt_ipmd_tuned_fullbatch_cfg_entry_point

  # --- The variable ---
  z_dim: 64
  command_dim: 66
  code_latent_dim: 64

  # --- Everything else is the control's interface ---
  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  command_mode: z
  # The star-v2 64-D merged hub encoder, pretrain complete at 50,000 updates.
  encoder_ckpt: /data/past_chunk_affine_64d/p5_affine_seed0/encoder/checkpoints/latest.pt

  # --- Tracker scale: the control's 20,480 x 24 = 491,520 frames per batch ---
  train_num_envs: 16384
  rollout_steps: 24
  frame_cap: 50000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/combo_50b/${vars.arm}_seed${vars.seed}

  # Optimizer extras from 2026-08-30-optimizer-ablation-5b. Empty on every arm
  # that does not take them; the reference 50B chain carries neither, so the
  # defaults are optim.weight_decay=0 (AdamW behaving as Adam) and
  # ipmd.critic_lr_schedule='constant' pinned at critic_learning_rate=1e-3.
  optim_args:
    - agent.optim.weight_decay=1.0e-2
    - agent.ipmd.critic_lr_schedule=linear
    - agent.ipmd.critic_lr_final=1.0e-5

  # Ten-step proprio history on the ACTOR only; the critic stays single-frame,
  # as in 2026-08-27-diffntp-history. Empty for every arm that does not take it.
  history_args:
    - env.observations.policy.projected_gravity.history_length=10
    - env.observations.policy.base_ang_vel.history_length=10
    - env.observations.policy.joint_pos_rel.history_length=10
    - env.observations.policy.joint_vel_rel.history_length=10
    - env.observations.policy.last_action.history_length=10

  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03

  # RESET SCHEDULE (user, 2026-09-03): ramp the reset mix from 80% uniform /
  # 20% failure-drawn to 20% / 80%, so late training concentrates on the
  # frames where the tracker terminates.
  #
  # The ramp drives `SonicAdaptiveResetSampler.uniform_sampling_rate` and is
  # only legal under `selection=sonic`: `random80_adaptive20` puts the
  # adaptive sampler INSIDE a random-trajectory wrapper that takes 80% of
  # resets, so a ramp there would rescale the remaining 20% only (the
  # `cont_det_hold1_resetramp` near-no-op of 2026-08-28, and the config
  # refuses the combination). Switching to `sonic` therefore also drops the
  # random first-half start frames: SONIC picks rank AND frame jointly from
  # its bin distribution. That is a second change against the 10B `combo`
  # row, which ran `random80_adaptive20` throughout.
  #
  # `_advance_adaptive_ratio_curriculum` reads `common_step_counter`, which
  # RESTARTS every segment, so a ramp has to finish inside the segment that
  # starts it. A segment buys about 8.6B at ~150k fps, so the ramp is split
  # into two 4B stages: 0.8 -> 0.5 inside segment 1, 0.5 -> 0.2 inside
  # segment 2, pinned 0.2 from segment 3. That reaches 20/80 by roughly 13B
  # and holds it for the remaining 37B.
  select_ramp1:
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.8
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=0.5
    - env.command_interface.reference.selection.adaptive_ratio_ramp_frames=4000000000
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000

  select_ramp2:
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.5
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=0.2
    - env.command_interface.reference.selection.adaptive_ratio_ramp_frames=4000000000
    - env.enable_termination_curriculum=false

  select_hold:
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.2
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=null
    - env.enable_termination_curriculum=false

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - ${vars.agent_entry}
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-pareto
    - agent.logger.group_name=combo-50b
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=1000000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

  # Resume segment for arms that cannot finish 10B in one 15:59 window. The
  # cap stays 10B (the critic ramp and the budget both read it); the
  # curriculum is over by 30M, so it is off here as in past-chunk.
  # Every resume keeps the FULL 50B cap: `_apply_critic_lr_schedule` reads
  # `collector.total_frames`, which is the segment's own `--max_iterations`,
  # so a smaller cap on a later segment would push the critic lr back up.
  # The curriculum is over by 30M, so it is off from segment 2 on.
  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
    - ${vars.encoder_ckpt}
  output_container_path: ${vars.output_root}

arms:
  combo:
    vars:
      wandb_id: c50b-combo
    stages:
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.history_args},${vars.select_ramp1},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,combo-50b,${vars.arm},seed${vars.seed},lowlevel1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.history_args},${vars.select_ramp2},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,combo-50b,${vars.arm},seed${vars.seed},lowlevel2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel3
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.history_args},${vars.select_hold},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel2
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,combo-50b,${vars.arm},seed${vars.seed},lowlevel3
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel4
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.history_args},${vars.select_hold},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel3
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,combo-50b,${vars.arm},seed${vars.seed},lowlevel4
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel5
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.history_args},${vars.select_hold},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel4
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,combo-50b,${vars.arm},seed${vars.seed},lowlevel5
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel6
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.history_args},${vars.select_hold},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel5
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,combo-50b,${vars.arm},seed${vars.seed},lowlevel6
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel7
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.history_args},${vars.select_hold},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel6
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
