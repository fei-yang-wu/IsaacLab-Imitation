# Endpoint-collapse probe, Tier B on ICE: the suffix-k dose-response arms.
#
# Read README.md first. One moved variable per arm: encoder_window_mode
# (suffix1 / suffix2 / suffix5 / suffix9). suffix9 equals the production
# 'intermediate' mode at horizon 10 and is the control row. Everything else
# is the round-4 diffntp_chunk pretrain recipe from
# 2026-08-22-pareto-stack, byte-matched.
#
# Pretrain-only stages: no tracker training here. The comparison metrics are
# `train/jepa_endpoint_loss_eval` and `train/jepa_ntp_loss_eval` in each
# arm's metrics.jsonl (frozen 10% trajectory eval split). Local seed-0
# qualification ran 2026-08-29 on the workstation; ICE adds seeds for noise
# bars. Logger stays `none`: metrics.jsonl carries everything this campaign
# needs, so no W&B runs are created.
name: endpoint-collapse-probe
profile: ice
wandb_project: g1-bones-seed
wandb_group: endpoint-collapse-probe

vars:
  task: Isaac-Imitation-G1-v2
  window_mode: suffix9
  horizon: "10"
  source_args: []
  submit_seed: 0

  pretrain_updates: 50000
  pretrain_batch_size: 8192

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/endpoint_collapse_probe/${vars.arm}_seed${vars.seed}

  pretrain_args:
    - --task
    - ${vars.task}
    - --num_envs
    - "16"
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --logger_backend
    - none
    - --output_dir
    - ${vars.output_root}/encoder
    - --horizon_steps
    - ${vars.horizon}
    - --encoder_window_mode
    - ${vars.window_mode}
    - --transition_objective
    - jepa_ntp
    - --jepa_loss
    - sigreg_ebm
    - --jepa_ntp_head
    - diff_chunk
    - --latent_mode
    - deterministic
    - --z_dim
    - "256"
    - --encoder_layer_norm
    - --encoder_hidden_dims
    - "2048"
    - "1024"
    - "512"
    - "512"
    - --encoder_activation
    - silu
    - --diffsr_feature_dim
    - "256"
    - --diffsr_embed_dim
    - "1024"
    - --diffsr_g_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --diffsr_mu_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - "1000"
    - --eval_batches
    - "4"

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - "env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]"
    - "env.expert_macro_state_terms=[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
    - env.expert_macro_frame_stride=1
    - env.expert_macro_anchor_mode=robot_heading

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  output_container_path: /data/endpoint_collapse_probe/${vars.arm}_seed${vars.seed}

arms:
  suffix1:
    vars:
      window_mode: suffix1
    stages: &pretrain_only
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_args},${vars.source_args},${vars.data_overrides}}
        time_limit: "03:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,endpoint-collapse-probe,${vars.arm},seed${vars.seed},pretrain

  suffix2:
    vars:
      window_mode: suffix2
    stages: *pretrain_only

  suffix5:
    vars:
      window_mode: suffix5
    stages: *pretrain_only

  suffix9:
    vars:
      window_mode: suffix9
    stages: *pretrain_only

  # ---- Horizon sweep: the coherent window-size comparison ---------------
  # A suffix arm hands the encoder a view that never occurs at deployment:
  # it sees only late frames but must still predict a target a full horizon
  # away, anchored at the window start. These arms move the horizon itself,
  # so the encoder input, the endpoint target, and the next-chunk target all
  # shrink together and every arm stays internally coherent.
  #
  # Raw losses are NOT comparable across these arms: the chunk target is
  # horizon x 38 wide, so it changes size with the horizon. Compare
  # `train/jepa_endpoint_z_explained` and `train/jepa_ntp_z_explained`
  # instead -- 1 - real/shuffled-code loss, which is dimensionless.
  #
  # h10 is the same recipe as suffix9 and is re-declared here only so the
  # sweep carries its own control row under matched logging.
  h1:
    vars:
      horizon: "1"
      # horizon 1 has no intermediate window at all, so this arm must use
      # 'full' -- and then the single visible frame IS the endpoint target.
      # It is a degenerate ceiling row (the code can copy the answer), not a
      # member of the dose-response curve.
      window_mode: full
    stages: *pretrain_only

  h2:
    vars:
      horizon: "2"
      window_mode: intermediate
    stages: *pretrain_only

  h5:
    vars:
      horizon: "5"
      window_mode: intermediate
    stages: *pretrain_only

  h10:
    vars:
      horizon: "10"
      window_mode: intermediate
    stages: *pretrain_only

  # ---- phi's conditioning: give the SOURCE a past chunk ------------------
  # Every arm above changes what the ENCODER sees. These two change what phi
  # conditions on: `s[t-10..t]` instead of `s_t` alone. The macro state is
  # root_qpos and carries no velocities, so a single frame cannot express
  # which way the motion is already going. Measured on 2,998 held-out
  # windows, a linear probe predicts s[t+10] from the past at R2 0.75 and
  # leaves ~25% of the variance unexplained, so this does not starve z.
  #
  # Both arms are otherwise the round-4 `diffntp_chunk_h1_ee_wide` recipe,
  # identical to h10/suffix9. phi/g/mu are pretrain-only heads, so neither
  # arm changes the deployed command width.
  #
  # Read `train/jepa_endpoint_z_explained` and `train/jepa_ntp_z_explained`
  # against h10: they measure what z adds ON TOP of the conditioning, which
  # is the quantity that actually changes when phi gets the past.
  srccur10:
    vars:
      horizon: "10"
      window_mode: intermediate
      # Anchor on s_t: the past reads as negative displacement, and the
      # encoder's own input stays byte-identical to h10, so this encoder
      # remains drop-in comparable and deployable.
      source_args: ["--source_history_steps", "10", "--source_anchor", "current"]
    stages: *pretrain_only

  srcpast10:
    vars:
      horizon: "10"
      window_mode: intermediate
      # Anchor on the OLDEST past frame, making s[t-10..t+10] one macro window
      # anchored at its first slot. s_t is no longer canonical, so the
      # ENCODER's input distribution changes: this z is NOT comparable with
      # the other arms, and no tracker can bind it until the frozen command
      # sampler can anchor on a delayed robot heading. Pretrain diagnostic.
      source_args:
        ["--source_history_steps", "10", "--source_anchor", "past_start"]
    stages: *pretrain_only
