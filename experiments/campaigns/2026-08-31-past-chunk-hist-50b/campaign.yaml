# 2026-08-31 - past-chunk phi plus ten-step proprioceptive history, 64-D, 50B.
#
# Two arms, seed 0, 50B environment frames each. Both bind an EXISTING encoder
# from `2026-08-30-past-chunk-affine-64d` (jobs 5599861 and 5599864, both
# COMPLETED), so this campaign has no pretrain stage and no encoder-init noise
# between it and that campaign's rows.
#
#   p5h10_concat  <- /data/past_chunk_affine_64d/p5_concat_seed0/encoder
#   p5h10_affine  <- /data/past_chunk_affine_64d/p5_affine_seed0/encoder
#
# Each encoder is the star-v2 64-D merged hub (`--jepa_ntp_head diff_chunk
# --jepa_ntp_chunk_span boundary_next --jepa_endpoint_coeff 0`) whose phi reads
# a five-frame past chunk (`--source_history_steps 5 --source_anchor current`,
# 228-value source). The arms differ only in `--diffsr_phi_parameterization`,
# concat against affine, which is a property of the checkpoint, not of this
# campaign.
#
# THREE CHANGES AGAINST `past-chunk-affine-64d`, all tracker-side, all on user
# direction 2026-08-31:
#
#   1. TEN-STEP PROPRIO HISTORY on the five policy observation terms
#      (`projected_gravity`, `base_ang_vel`, `joint_pos_rel`, `joint_vel_rel`,
#      `last_action`). The critic stays single-frame, as in
#      `2026-08-27-diffntp-history`. That campaign measured this knob at 256-D
#      on the two-head form and REFUTED it: at matched 2.0B it cost 0.027 SR,
#      +11% MPJPE-L, +13% MPJPE-G and +33% wrist terminations, and its only
#      gain (-9.6% acceleration) was gone by 4.0B and absent under `no_push`.
#      This is a re-test in a different cell: phi's past chunk moves reference
#      momentum out of `z`, and the history covers the actor's own state
#      estimate. The actor is NOT velocity-blind without it -- `joint_vel_rel`
#      and `base_ang_vel` are already policy terms at one frame -- so what the
#      history buys is filtering and lag compensation, not new state.
#
#   2. NO PHASE CHANNEL, command 66 -> 64. At `code_period=1` with
#      `command_phase_source='hold'` the `sin_cos` pair is constant
#      ("Informationally dead at code_period=1", `rlopt/agent/ipmd/ipmd.py`),
#      so this drops two constant channels. The recorded phase failures
#      (`g5_phase_none_h10` 0.3784, v1 `use_phase_none` 0.3679) are hold-10
#      rows where the slot clock varies and do not apply here. It is still a
#      second difference from the `p5_*` rows, so a negative result cannot be
#      split between the history and the width.
#
#   3. WEIGHT DECAY AND CRITIC DECAY, from `2026-08-30-optimizer-ablation-5b`:
#      `optim.weight_decay=1e-2`, `ipmd.critic_lr_schedule=linear`,
#      `ipmd.critic_lr_final=1e-5`. Neither was promoted; both are adopted here
#      by user direction. Final 5B MPJPE-L in that campaign, seed 0, 300M
#      window, arm-vs-arm with no matched control: `mb_full_e3` 28.54 +- 0.08,
#      `wd_1e2` 30.33, `wd_1e4` 31.55, `mb_half_e5` 32.71, `critic_lin` 33.66.
#      Every `wd_*` and `critic_lin` arm ran at `ctrl`'s 10-step geometry, so
#      weight decay x full batch has NEVER been run and this stack is a new
#      cell. The reason to carry `wd_1e2` at this budget is stability, not that
#      row: only `mb_full_e3` and `wd_1e2` never degraded, while six of eight
#      arms turned over after ~2.3B, and this chain runs 20x past that point.
#      `critic_lin` led at 3.6B and finished fifth through six declining
#      windows, so it is not protective on the record.
#
# CRITIC DECAY HORIZON. `_apply_critic_lr_schedule` divides
# `metadata.frames_processed` by `collector.total_frames`, which is the
# segment's own `--max_iterations` cap. EVERY stage here therefore passes the
# SAME 50B cap, so the decay is one monotone 1e-3 -> 1e-5 ramp across the whole
# chain and a resume continues it. Giving a stage a smaller cap would make the
# critic learning rate jump back up at that stage boundary.
#
# RESET REGIME. `random80_adaptive20` for the whole 50B, termination curriculum
# OFF from the first frame, no `sonic` switch and no failure-share ramp (user
# direction 2026-08-31). Every stage is therefore identical except for the
# resume flag. This differs from `past-chunk-affine-64d`, which ramped the
# sonic failure share 0.8 -> 0.2 over its first 1B, so `p5_concat`'s finished
# 5B row is NOT a matched control for these arms at any frame count. It is the
# nearest reference row and the recipe ancestor.
#
# OPTIMIZER GEOMETRY. `--agent rlopt_ipmd_tuned_fullbatch_cfg_entry_point`:
# full batch, 3 epochs, 3 optimizer steps per iteration. Never pass
# `agent.loss.mini_batch_size` or `agent.loss.epochs`; the class owns both and
# a literal minibatch would silently become a partial batch.
#
# BUDGET. 50B is the frame target of every segment. `p5_concat` reached 5B in
# 8h29m at this environment count without the history, so 50B is roughly seven
# segments per arm; the eight declared here leave headroom, and a segment that
# starts after the budget is met exits immediately with "0 iterations remain".
name: past-chunk-hist-50b
profile: ice
wandb_project: g1-bs-pareto
wandb_group: past-chunk-hist-50b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}

  # --- Latent interface: the 64-D merged hub, phase channel dropped ---
  z_dim: 64
  command_dim: 64
  code_latent_dim: 64
  # `command_phase_source` and `command_phase_period` are moot at phase `none`.
  phase_mode: none
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  command_mode: z

  # --- Encoder: reused from past-chunk-affine-64d, overridden per arm ---
  encoder_arm: SET_PER_ARM
  encoder_ckpt: /data/past_chunk_affine_64d/${vars.encoder_arm}_seed0/encoder/checkpoints/latest.pt

  # --- Tracker scale: 20,480 x 24 = 491,520 frames per batch, 50B budget ---
  train_num_envs: 20480
  rollout_steps: 24
  frame_cap: 50000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/past_chunk_hist_50b/${vars.arm}_seed${vars.seed}

  # merged64_pen_ramp_5b rewards; feet_acc -2.5e-6 from the in-tree default.
  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03

  # Ten-step proprio history on the actor only. The critic keeps single frames.
  history_args:
    - env.observations.policy.projected_gravity.history_length=10
    - env.observations.policy.base_ang_vel.history_length=10
    - env.observations.policy.joint_pos_rel.history_length=10
    - env.observations.policy.joint_vel_rel.history_length=10
    - env.observations.policy.last_action.history_length=10

  # Fixed for the whole 50B: no curriculum, no ramp, no sonic switch.
  select_fixed:
    - env.command_interface.reference.selection=random80_adaptive20
    - env.enable_termination_curriculum=false

  # Adopted from optimizer-ablation-5b. The critic ramp is monotone only
  # because every stage carries the same 50B cap.
  optim_args:
    - agent.optim.weight_decay=1.0e-2
    - agent.ipmd.critic_lr_schedule=linear
    - agent.ipmd.critic_lr_final=1.0e-5

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_fullbatch_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-pareto
    - agent.logger.group_name=past-chunk-hist-50b
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.data.reference_prefetch_mode=next

  # No `agent.loss.mini_batch_size` and no `agent.loss.epochs`: the fullbatch
  # entry point owns both.
  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  seg_fresh:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

  seg_resume:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
    - ${vars.encoder_ckpt}
  output_container_path: ${vars.output_root}

arms:
  # phi concat with the five-frame past chunk, the production path.
  p5h10_concat:
    vars:
      encoder_arm: p5_concat
      wandb_id: pch50-concat
    stages: &hist_stages
      - name: seg1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.optim_args},${vars.reward_args},${vars.history_args},${vars.select_fixed},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg_fresh}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-hist-50b,${vars.arm},seed${vars.seed},seg1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: seg2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.optim_args},${vars.reward_args},${vars.history_args},${vars.select_fixed},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg_resume}}
        depends_on: seg1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-hist-50b,${vars.arm},seed${vars.seed},seg2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: seg3
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.optim_args},${vars.reward_args},${vars.history_args},${vars.select_fixed},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg_resume}}
        depends_on: seg2
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-hist-50b,${vars.arm},seed${vars.seed},seg3
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: seg4
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.optim_args},${vars.reward_args},${vars.history_args},${vars.select_fixed},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg_resume}}
        depends_on: seg3
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-hist-50b,${vars.arm},seed${vars.seed},seg4
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: seg5
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.optim_args},${vars.reward_args},${vars.history_args},${vars.select_fixed},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg_resume}}
        depends_on: seg4
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-hist-50b,${vars.arm},seed${vars.seed},seg5
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: seg6
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.optim_args},${vars.reward_args},${vars.history_args},${vars.select_fixed},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg_resume}}
        depends_on: seg5
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-hist-50b,${vars.arm},seed${vars.seed},seg6
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: seg7
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.optim_args},${vars.reward_args},${vars.history_args},${vars.select_fixed},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg_resume}}
        depends_on: seg6
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-hist-50b,${vars.arm},seed${vars.seed},seg7
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: seg8
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.optim_args},${vars.reward_args},${vars.history_args},${vars.select_fixed},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg_resume}}
        depends_on: seg7
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,past-chunk-hist-50b,${vars.arm},seed${vars.seed},seg8
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # The same past chunk with phi affine in z.
  p5h10_affine:
    vars:
      encoder_arm: p5_affine
      wandb_id: pch50-affine
    stages: *hist_stages
