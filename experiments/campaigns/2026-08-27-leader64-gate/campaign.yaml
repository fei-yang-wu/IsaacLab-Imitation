# Does the candidate leader survive a 64-D command channel?
#
# THE GATE, not an ablation. Every arm of the planned ablation set inherits the
# leader's code width, so this one run decides what that width is before the set
# is submitted. A 66-value command is a far better planner target than a
# 258-value one, and the 2B evidence says width is free -- at hold 10.
#
# What is open: width x hold is the ONE interaction this program has caught, and
# it points the other way. The only 64-D hold-1 cell ever run is
# `ix_fsq64_hold1`, which LOST success rate against its hold-10 partner
# (0.8789 vs 0.9023) while the 256-D arm GAINED at hold 1 (0.9180 vs 0.9102).
# That cell is quantized; continuous 64-D at hold 1 has never been run.
#
# Its control is `diffntp_chunk_h1_ee_wide` from `2026-08-22-pareto-stack`
# (0.9297 / 23.45 / 74.85 on `bones_milestone_testbed256_v1`), which is 256-D
# with the phase channel on and no action-rate penalty. THREE fields move at
# once here, so a shortfall does not say which one caused it:
#
#   1. width 256 -> 64 (command 258 -> 64)
#   2. phase channel dropped
#   3. action_rate_l2 restored at -0.03
#
# (2) is defensible as free: at `code_period=1` the hold clock pins the phase
# constant, so the star's hold-1 arms already ran phase-free in everything but
# the two wasted command slots, and `hold1_live_phase` measured a live clock as
# a null there. (3) matches the 50B promotion chains, which restored the same
# -0.03 -- the measured efficient point of the 2026-08-26 smoothness sweep.
# If this arm falls short, the decomposition arm to run is 256-D + phase +
# action-rate, which isolates (3).
name: leader64-gate
profile: ice
wandb_project: g1-bones-seed
wandb_group: leader64-gate

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  wandb_id: l64-gate

  # ---- The candidate leader. ----
  # Generative next-chunk prediction: the diffusion head models the next chunk's
  # H raw frames in the EXECUTED chunk's heading frame, so the cross-chunk
  # displacement stays in the target. This loss carries no self-target.
  objective: jepa_ntp
  objective_args:
    - --jepa_loss
    - sigreg_ebm
    - --jepa_ntp_head
    - diff_chunk
  latent_mode: deterministic
  mode_args: []
  # The gate itself. `command_dim` is `z_dim` alone: with the phase channel off
  # the command carries no clock slots.
  z_dim: 64
  command_dim: 64
  code_latent_dim: 64
  ln_args: ["--encoder_layer_norm"]
  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: none
  phase_source: hold
  phase_period: 0
  command_mode: z
  finetune_args: ["agent.ipmd.hl_skill_finetune_enabled=false"]
  # The two extra tracking terms of the candidate Final Control, plus the
  # action-rate penalty at the 50B chains' weight. `action_rate_l2` is set HERE
  # rather than in `tuned_core`, which no longer zeroes it.
  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03
  extra_args: []

  encoder_ckpt: ${vars.output_root}/encoder/checkpoints/latest.pt
  encoder_source: pretrained

  pretrain_updates: 50000
  pretrain_batch_size: 8192
  train_num_envs: 16384
  rollout_steps: 24
  # The ablation set's budget. Every segment carries the full target; the resume
  # checkpoint carries cumulative_env_frames, so the chain stops here.
  frame_cap: 2000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/leader64_gate/${vars.arm}_seed${vars.seed}

  pretrain_head:
    - --task
    - ${vars.task}
    - --num_envs
    - 16
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --output_dir
    - ${vars.output_root}/encoder
    - --logger_backend
    - wandb
    - --wandb_project
    - g1-bones-seed
    - --wandb_group
    - leader64-gate
    - --wandb_run_name
    - ${vars.wandb_arm}-pretrain-s${vars.seed}
    - --horizon_steps
    - 10
    - --encoder_window_mode
    - ${vars.window_mode}
    - --transition_objective
    - ${vars.objective}
    - --latent_mode
    - ${vars.latent_mode}
    - --z_dim
    - ${vars.z_dim}

  pretrain_tail:
    - --encoder_hidden_dims
    - 2048
    - 1024
    - 512
    - 512
    - --encoder_activation
    - silu
    - --diffsr_feature_dim
    - 256
    - --diffsr_embed_dim
    - 1024
    - --diffsr_g_hidden_dims
    - 1024
    - 1024
    - 512
    - --diffsr_mu_hidden_dims
    - 1024
    - 1024
    - 512
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - 1000
    - --eval_batches
    - 4

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=leader64-gate
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.command_phase_source=${vars.phase_source}
    - agent.ipmd.latent_learning.command_phase_period=${vars.phase_period}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  # The study's frozen training core, MINUS the `action_rate_l2` zero: this
  # campaign sets that weight in `reward_args` instead.
  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.command_interface.reference.selection=random80_adaptive20
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=250000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
  output_container_path: ${vars.output_root}

arms:
  # Continuous 64-D, hold 1, no phase channel, generative next-chunk objective,
  # EE + wide anchor rewards, action-rate -0.03.
  leader64_h1_nophase:
    vars: {}
    stages:
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_head},${vars.objective_args},${vars.mode_args},${vars.ln_args},${vars.pretrain_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,leader64-gate,${vars.arm},seed${vars.seed},pretrain
          WANDB_RUN_ID: ${vars.wandb_id}-pre-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.finetune_args},${vars.reward_args},${vars.extra_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        depends_on: pretrain
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,leader64-gate,${vars.arm},seed${vars.seed},lowlevel,segment1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.finetune_args},${vars.reward_args},${vars.extra_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,leader64-gate,${vars.arm},seed${vars.seed},lowlevel,segment2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
