# 2026-09-01 - does a 64-D latent train under the 50B control's regime? 10B.
#
# REFERENCE RUN: `diffntp_chunk_50b` in `2026-08-31-diffntp-chunk-50b-fullbatch`
# (W&B run `diffntp-chunk-50b-s0-2026-09-01_08-48-21`, jobs 5601421-5601431).
# Its `std1`-`std3` completed 10B under the same `random80_adaptive20`
# selection and termination curriculum, so this arm reads against that run at a
# matched cumulative frame count.
#
# WHAT MOVES. Two things, not one, and this is a deliberate choice by the user
# (2026-09-01): the latent width 256 -> 64, AND the pretrain head. The
# reference run binds `diffntp_chunk_h1_ee_wide`, the TWO-HEAD form
# (`--jepa_ntp_head diff_chunk` with separate endpoint and chunk heads). This
# arm binds the star-v2 hub encoder, the MERGED single head
# (`--jepa_ntp_chunk_span boundary_next --jepa_endpoint_coeff 0`), which is the
# formulation the user wants carried forward. Everything else in that
# encoder's pretrain matches the reference: `--jepa_loss sigreg_ebm`,
# deterministic latent, `--encoder_layer_norm`, `--encoder_window_mode
# intermediate`, `--horizon_steps 10`, 50,000 updates at batch 8,192, the same
# 380-value `root_qpos` macro state, stride 1, `robot_heading` anchor.
# `latest.pt.json` records `{"update": 50000}`, so the pretrain is complete.
#
# THEREFORE THIS ARM CANNOT ATTRIBUTE a difference against the reference run to
# the width alone. The clean width comparison at the merged head is already
# running and needs no job here: `hub` (64-D) against `g3_cont256` (256-D) in
# `2026-08-30-latent-star-v2`, same head, same pretrain, 5B each. What this
# arm adds is whether the merged 64-D interface trains under the 50B chain's
# own tracker regime and budget, which star-v2 does not test (it runs the
# sonic 0.8 -> 0.2 failure ramp at 5B).
#
# NO PRETRAIN STAGE. The hub encoder already exists at
# /data/latent_star_v2/hub_seed0/encoder/checkpoints/latest.pt, so this is one
# job. Binding it also removes encoder-initialization noise against every
# star-v2 row that shares it.
#
# THE PHASE CHANNEL IS INERT HERE. `command_phase_mode=sin_cos` with
# `phase_source='hold'` at `code_period=1` publishes a constant: `phase =
# (phase_period - latent_steps) / phase_period` is 0 on every step
# (`hl_skill_diffsr.py`, and the config docstring says "Informationally dead at
# code_period=1"). It is kept because the reference run keeps it; the command
# is 66 wide against the reference's 258, and the 2 extra values are constants
# in both.
#
# ONE SEGMENT, cap NOT shrunk. The stage carries the full 10B target and the
# 15:59 walltime ends it. Read the result against the reference run at the SAME
# cumulative frame count, never against its 10B endpoint.
name: latent64-probe-10b
profile: ice
wandb_project: g1-bs-pareto
wandb_group: latent64-probe-10b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}

  # --- The variable ---
  z_dim: 64
  command_dim: 66
  code_latent_dim: 64

  # --- Everything else is the control's interface ---
  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  command_mode: z
  # The star-v2 64-D merged hub encoder, pretrain complete at 50,000 updates.
  encoder_ckpt: /data/latent_star_v2/hub_seed0/encoder/checkpoints/latest.pt

  # --- Tracker scale: the control's 20,480 x 24 = 491,520 frames per batch ---
  train_num_envs: 20480
  rollout_steps: 24
  frame_cap: 10000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/latent64_probe_10b/${vars.arm}_seed${vars.seed}

  # Ten-step proprio history on the ACTOR only; the critic stays single-frame,
  # as in 2026-08-27-diffntp-history. Empty for every arm that does not take it.
  history_args: []

  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03

  # The control's `select_std`: reset selection and curriculum verbatim.
  select_std:
    - env.command_interface.reference.selection=random80_adaptive20
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_fullbatch_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-pareto
    - agent.logger.group_name=latent64-probe-10b
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
    - ${vars.encoder_ckpt}
  output_container_path: ${vars.output_root}

arms:
  z64_merged:
    vars:
      wandb_id: l64p-z64m
    stages: &probe_stages
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.history_args},${vars.select_std},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent64-probe,${vars.arm},seed${vars.seed},lowlevel1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # ---- Encoder-side past chunk. One variable against `z64_merged`: phi reads
  # ---- s[t-5..t] instead of s_t alone (`--source_history_steps 5
  # ---- --source_anchor current`, 228-value source). The checkpoint is
  # ---- p5_concat's, pretrained 2026-08-31 with the same merged head, the same
  # ---- 50,000 updates at batch 8,192, LN, intermediate window, horizon 10 and
  # ---- deterministic latent. It is a DIFFERENT pretrain run, so the
  # ---- comparison also carries encoder-initialization noise, measured in
  # ---- 2026-08-30-encoder-interface-500m as 0.0064 SR / 0.46 mm MPJPE-L /
  # ---- 10.8 mm MPJPE-G across three replicates of one recipe.
  enc_hist:
    vars:
      wandb_id: l64p-enchist
      encoder_ckpt: /data/past_chunk_affine_64d/p5_concat_seed0/encoder/checkpoints/latest.pt
    stages: *probe_stages

  # ---- Actor-side proprio history. Ten steps on projected_gravity,
  # ---- base_ang_vel, joint_pos_rel, joint_vel_rel and last_action; the critic
  # ---- keeps single frames.
  # ----
  # ---- 16,384 ENVIRONMENTS, NOT 20,480, and this is forced. The history
  # ---- widens the actor observation from about 157 to about 994 values per
  # ---- frame, and RLOpt holds `frames_per_batch` transitions in a
  # ---- LazyTensorStorage on the training device with no CPU option. At 20,480
  # ---- that left physics no room for its CUDA graph: jobs 5605194 and 5605202
  # ---- both died with `Warp CUDA error 2: out of memory (in function
  # ---- wp_cuda_graph_launch)` seven minutes in, on two different H200 nodes.
  # ---- 16,384 is the count 2026-08-27-diffntp-history ran this history set at.
  # ----
  # ---- The environment count is therefore a SECOND difference against
  # ---- `z64_merged`; `ctrl16k` is the matched control that removes it.
  obs_hist:
    vars:
      wandb_id: l64p-obshist
      train_num_envs: 16384
      history_args:
        - env.observations.policy.projected_gravity.history_length=10
        - env.observations.policy.base_ang_vel.history_length=10
        - env.observations.policy.joint_pos_rel.history_length=10
        - env.observations.policy.joint_vel_rel.history_length=10
        - env.observations.policy.last_action.history_length=10
    stages: *probe_stages

  # ---- `z64_merged` at 16,384 environments and nothing else, so that
  # ---- `obs_hist` has a one-variable control at its own batch size.
  ctrl16k:
    vars:
      wandb_id: l64p-ctrl16k
      train_num_envs: 16384
    stages: *probe_stages
