# 2026-09-01 - is the 64-D latent the reason? One arm, one variable, 10B.
#
# CONTROL: `diffntp_chunk_50b` in `2026-08-31-diffntp-chunk-50b-fullbatch`
# (W&B run `diffntp-chunk-50b-s0-2026-09-01_08-48-21`, jobs 5601421-5601431).
# Its `std1`-`std3` stages have COMPLETED the same 10B budget under the same
# `random80_adaptive20` selection and the same termination curriculum, so this
# arm reads directly against the control's own first 10B.
#
# THE ONE VARIABLE: the latent width. The encoder is pretrained here with the
# control's exact objective and settings -- `--jepa_loss sigreg_ebm
# --jepa_ntp_head diff_chunk` (the two-head form), deterministic latent,
# `--encoder_layer_norm`, `--encoder_window_mode intermediate`,
# `--horizon_steps 10`, 50,000 updates at batch 8,192 -- and differs ONLY in
# `--z_dim 64` instead of 256. The command is 66 wide (64 + the 2-wide sin_cos
# phase) instead of 258. Every tracker field is copied from the control's
# `std1` stage: `rlopt_ipmd_tuned_fullbatch_cfg_entry_point`, 20,480
# environments x 24 rollout steps, `motion_ee_pos` 1.0,
# `motion_global_anchor_pos_wide` 1.0, `action_rate_l2` -0.03,
# `tracking_reward_points` 4.0, `reference_prefetch_mode=next`, no proprio
# history, no weight decay, no critic schedule.
#
# WHY A FRESH PRETRAIN. No 64-D two-head encoder exists to bind. The only one
# ever made, `leader64_h1_nophase` in `2026-08-27-leader64-gate`, has left ICE
# with its tree, and every other 64-D encoder on disk is the MERGED head
# (`--jepa_ntp_chunk_span boundary_next --jepa_endpoint_coeff 0`), which would
# move the head as well as the width. The pretrain took 45 minutes for the
# comparable 64-D merged encoder, so it is a cheap first stage.
#
# WHAT THIS DOES NOT SETTLE. `leader64_h1_nophase` was CANCELLED at 0.84B with
# episode length plateaued at 50-62 and MPJPE-L flat near 51 mm, while its
# 256-D control was at 166 / 42.6 mm by 0.17B. That arm carried NO phase
# channel; this one keeps the control's `sin_cos` phase, which is why the two
# are not the same test. If this arm reproduces that stall, the width is
# implicated at the two-head form; if it trains, the earlier stall was the
# phase or the run, not the width.
#
# The width question at the MERGED head is already in flight and needs no job
# here: `hub` (64-D) against `g3_cont256` (256-D) in
# `2026-08-30-latent-star-v2`, same head, 5B each.
#
# ONE SEGMENT, cap NOT shrunk. The stage carries the full 10B target and the
# 15:59 walltime ends it whenever it ends. The control reached 10B across three
# segments, so this arm reports whatever depth one segment buys; read it
# against the control at the SAME cumulative frame count, never against the
# control's 10B endpoint.
name: latent64-probe-10b
profile: ice
wandb_project: g1-bs-pareto
wandb_group: latent64-probe-10b

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}

  # --- The variable ---
  z_dim: 64
  command_dim: 66
  code_latent_dim: 64

  # --- Everything else is the control's interface ---
  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  command_mode: z
  pretrain_updates: 50000
  pretrain_batch_size: 8192
  encoder_ckpt: ${vars.output_root}/encoder/checkpoints/latest.pt

  # --- Tracker scale: the control's 20,480 x 24 = 491,520 frames per batch ---
  train_num_envs: 20480
  rollout_steps: 24
  frame_cap: 10000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/latent64_probe_10b/${vars.arm}_seed${vars.seed}

  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03

  # The control's `select_std`: reset selection and curriculum verbatim.
  select_std:
    - env.command_interface.reference.selection=random80_adaptive20
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000

  pretrain_head:
    - --task
    - ${vars.task}
    - --num_envs
    - "16"
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --output_dir
    - ${vars.output_root}/encoder
    - --logger_backend
    - wandb
    - --wandb_project
    - g1-bs-pareto
    - --wandb_group
    - latent64-probe-10b
    - --wandb_run_name
    - ${vars.wandb_arm}-pretrain-s${vars.seed}
    - --horizon_steps
    - "10"
    - --encoder_window_mode
    - ${vars.window_mode}
    - --transition_objective
    - jepa_ntp
    - --jepa_loss
    - sigreg_ebm
    - --jepa_ntp_head
    - diff_chunk
    - --latent_mode
    - deterministic
    - --z_dim
    - ${vars.z_dim}
    - --encoder_layer_norm

  pretrain_tail:
    - --encoder_hidden_dims
    - "2048"
    - "1024"
    - "512"
    - "512"
    - --encoder_activation
    - silu
    - --diffsr_feature_dim
    - "256"
    - --diffsr_embed_dim
    - "1024"
    - --diffsr_g_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --diffsr_mu_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - "1000"
    - --eval_batches
    - "4"

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_fullbatch_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-pareto
    - agent.logger.group_name=latent64-probe-10b
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
  output_container_path: ${vars.output_root}

arms:
  z64:
    vars:
      wandb_id: l64p-z64
    stages:
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_head},${vars.pretrain_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent64-probe,${vars.arm},seed${vars.seed},pretrain
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.select_std},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        depends_on: pretrain
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,latent64-probe,${vars.arm},seed${vars.seed},lowlevel1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
