# Linear closure of the skill latent: the affine spectral arm.
#
# One design question. The skill latent z is the action space of the high-level
# MDP, so the planner must emit points in it. We want that space closed under
# linear combination: a·z1 + b·z2 of two valid skills should mean something
# predictable. Today nothing forces that, because the path from z to the
# grounding score runs through an MLP.
#
# The change is one flag on encoder pretraining:
# `--diffsr_phi_parameterization affine` makes phi(s,z) = F(s)^T (A z + b)
# / sqrt(E). Both DiffSR heads (the endpoint head for p(s[t+10]|s_t,z) and the
# diff_chunk head for p(s[t+11..t+20]|s_t,z)) become affine in z, so the
# learned denoising score field is affine in z and an interpolated latent
# grounds to the geometric mixture of its endpoints' conditionals:
# p(y|s,z_a) is proportional to p(y|s,z1)^a p(y|s,z2)^(1-a). F(s), mu, and the
# encoder stay nonlinear; only the z path is constrained. A and b are learned.
#
# What the tracker consumes does NOT change: the sampler publishes
# [z (256); sin_cos phase (2)] = 258-D as `latent_command`, exactly as every
# other latent arm. phi, F(s), and the diffusion heads are pretraining-only.
#
# Arms (both pretrained here, so the comparison holds pretrain provenance
# fixed and moves exactly one variable):
#   affine    --diffsr_phi_parameterization affine
#   concat    --diffsr_phi_parameterization concat  (matched control; this is
#             the production parameterization of `diffntp_chunk_h1_ee_wide`)
#
# Everything else is the round-4 `diffntp_chunk` recipe (jepa_ntp + sigreg_ebm
# + diff_chunk head, intermediate window, 380-D root_qpos macro state,
# robot_heading anchor) and the smooth-ablation-5b tracker regime with the
# trained-in EMA action filter `env.actions.joint_pos.ema_alpha=0.65` — the
# current smoothness lead. 5B frames, 20,480 envs, failure-share ramp
# 0.8 -> 0.2 over the first 1B.
#
# The existing smooth-ablation-5b `ema` row is a THIRD comparison point, not a
# matched one: it reuses the pareto-stack encoder, so it differs from `concat`
# here by pretrain provenance as well.
#
# Scoreboard: bones_testbed4096_v1, clean + robust, alongside the standing
# sonic_v1_1 row for the same board.
name: linear-closure-affine
profile: ice
wandb_project: g1-bones-seed
wandb_group: linear-closure-affine

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}

  # --- Latent interface (identical to smooth-ablation-5b) ---
  z_dim: 256
  command_dim: 258
  code_latent_dim: 256
  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  phase_source: hold
  phase_period: 0
  command_mode: z
  finetune_args: ["agent.ipmd.hl_skill_finetune_enabled=false"]

  # --- Encoder pretraining ---
  # The per-arm variable. Overridden by each arm.
  phi_parameterization: concat
  pretrain_updates: 50000
  pretrain_batch_size: 8192
  # Each arm pretrains its own encoder, then binds it in the tracker stages.
  encoder_ckpt: ${vars.output_root}/encoder/checkpoints/latest.pt
  encoder_source: pretrained

  # --- Tracker scale (smooth-ablation-5b): frames/batch 491,520, mb 368,640 ---
  train_num_envs: 20480
  rollout_steps: 24
  frame_cap: 5000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}
  minibatch_size: ${floor_div:${mul:${vars.frames_per_batch},3},4}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/linear_closure_affine/${vars.arm}_seed${vars.seed}

  # smooth-ablation-5b base rewards; feet_acc -2.5e-6 comes from the in-tree
  # default.
  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03
  # The trained-in EMA action filter, shared by both arms. It is the tracker
  # regime, not the variable under test, so it must be repeated at eval.
  arm_args:
    - env.actions.joint_pos.ema_alpha=0.65

  # Failure-share ramp 0.8 -> 0.2 over the first 1B (segment 1 only).
  select_ramp:
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.8
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=0.2
    - env.command_interface.reference.selection.adaptive_ratio_ramp_frames=1000000000
  # Segment 2 pins the landed ratio so a resume never re-runs the ramp.
  select_hold:
    - env.command_interface.reference.selection=sonic
    - env.command_interface.reference.selection.adaptive_uniform_ratio=0.2
    - env.command_interface.reference.selection.adaptive_uniform_ratio_final=null

  pretrain_head:
    - --task
    - ${vars.task}
    - --num_envs
    - "16"
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --output_dir
    - ${vars.output_root}/encoder
    - --logger_backend
    - wandb
    - --wandb_project
    - g1-bones-seed
    - --wandb_group
    - linear-closure-affine
    - --wandb_run_name
    - ${vars.wandb_arm}-pretrain-s${vars.seed}
    - --horizon_steps
    - "10"
    - --encoder_window_mode
    - ${vars.window_mode}
    - --transition_objective
    - jepa_ntp
    - --jepa_loss
    - sigreg_ebm
    - --jepa_ntp_head
    - diff_chunk
    - --diffsr_phi_parameterization
    - ${vars.phi_parameterization}
    - --latent_mode
    - deterministic
    - --z_dim
    - ${vars.z_dim}
    - --encoder_layer_norm

  pretrain_tail:
    - --encoder_hidden_dims
    - "2048"
    - "1024"
    - "512"
    - "512"
    - --encoder_activation
    - silu
    - --diffsr_feature_dim
    - "256"
    - --diffsr_embed_dim
    - "1024"
    - --diffsr_g_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --diffsr_mu_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - "1000"
    - --eval_batches
    - "4"

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - rlopt_ipmd_tuned_cfg_entry_point
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bones-seed
    - agent.logger.group_name=linear-closure-affine
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.command_phase_source=${vars.phase_source}
    - agent.ipmd.latent_learning.command_phase_period=${vars.phase_period}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.loss.mini_batch_size=${vars.minibatch_size}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=250000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - env.enable_termination_curriculum=false
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
  output_container_path: ${vars.output_root}

arms:
  # The arm: phi affine in z, so both grounding scores interpolate exactly.
  affine:
    vars:
      wandb_id: lca-affine
      phi_parameterization: affine
    stages: &closure_stages
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_head},${vars.pretrain_tail},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,linear-closure-affine,${vars.arm},seed${vars.seed},pretrain
      - name: lowlevel1
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.finetune_args},${vars.reward_args},${vars.arm_args},${vars.select_ramp},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        depends_on: pretrain
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,linear-closure-affine,${vars.arm},seed${vars.seed},lowlevel,segment1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.finetune_args},${vars.reward_args},${vars.arm_args},${vars.select_hold},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,linear-closure-affine,${vars.arm},seed${vars.seed},lowlevel,segment2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  # Matched control: the production parameterization, pretrained here so the
  # only difference from `affine` is the phi parameterization flag.
  concat:
    vars:
      wandb_id: lca-concat
      phi_parameterization: concat
    stages: *closure_stages
