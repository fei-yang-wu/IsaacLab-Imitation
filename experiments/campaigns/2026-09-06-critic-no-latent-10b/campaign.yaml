# 2026-09-06 -- does the critic learn better WITHOUT the latent command?
#
# One change against its own control: `critic_channels=[reference]` removes
# `latent_command` from the critic observation group. The policy keeps it, so
# the actor is untouched and only the value input changes.
#
# Why this is not already answered: the only single-variable test of this axis
# is 2026-08-06-bones129k-critic-no-latent, at 5B on a 258-D z256 command at
# hold 10. It scored 0.90625 SR / 24.392 mm against its control's 0.90576 /
# 24.516 -- a 0.0005 SR gap, while a repeat pass over the IDENTICAL checkpoint
# SHA on the same board moved 0.0090 SR. The result is inside the eval's own
# repeat spread, so it is inconclusive, not a null. Nothing since 2026-08-10
# has touched `critic_channels`, and the v2 default stands at
# `critic_channels=("actor", "reference")`
# (imitation_g1_env_v2.py:184), so no hub-recipe measurement exists.
#
# Recipe, per the user (2026-09-06): the combo stack, but the past-5 CONCAT
# encoder rather than the affine one, phi as the policy conditioning channel,
# 64-D, no recurrent actor, and a FIVE-step actor observation history.
#
#   ctrl        critic keeps the latent  (the control)
#   nolatent    critic_channels=[reference]
#
# Both arms are otherwise identical: same encoder file, same seed, same 10B
# budget, same reset schedule, same optimizer.
name: critic-no-latent-10b
profile: ice
wandb_project: g1-bs-pareto
wandb_group: critic-no-latent

vars:
  task: Isaac-Imitation-G1-v2
  wandb_arm: ${dash:${vars.arm}}
  agent_entry: rlopt_ipmd_tuned_fullbatch_cfg_entry_point

  z_dim: 64
  command_dim: 66
  code_latent_dim: 64

  window_mode: intermediate
  macro_terms: "[expert_motion_qpos,expert_anchor_pos_b,expert_anchor_ori_b]"
  stride: 1
  anchor_mode: robot_heading
  hold: 1
  phase_mode: sin_cos
  # `phi` sends the encoder's phi(s_history, z) to the policy, not the raw
  # code, as in 2026-09-04-direct-affine-phi.
  command_mode: phi
  # A past-5 CONCAT encoder trained IN THIS CAMPAIGN, not the shared
  # `p5_concat_seed0` one. The shared hub encoders were pretrained with
  # `--diffsr_feature_dim 256` (2026-08-30-past-chunk-affine-64d:177), and phi's
  # width IS `diffsr_feature_dim` (`_command_code_dim_for_mode`,
  # hl_skill_diffsr.py:1507-1515), so binding one under `command_mode=phi` at
  # `code_latent_dim=64` dies at agent construction with
  # `code_latent_dim must match command-mode pre-phase width: 64 != 256`
  # (hl_skill_diffsr.py:1288; jobs 5712597/5712598, 2026-09-06). The pretrain
  # below is direct-affine-phi's, with `concat` in place of `affine`.
  feature_dim: 64
  pretrain_updates: 50000
  pretrain_batch_size: 8192
  encoder_ckpt: ${vars.output_root}/encoder/checkpoints/latest.pt

  # 20,480 (user, 2026-09-06). The phi channel does NOT widen the actor input:
  # `_command_code_dim_for_mode` returns `diffsr_feature_dim` for phi and
  # `z_dim` for z (hl_skill_diffsr.py:1507-1515), both 64 here, so the actor
  # sees the same 66-wide command in either mode. What differs is the cost of
  # producing it, and that cost is parameterization-specific: the AFFINE phi
  # builds a matrix-valued F(s) of `embed_dim * feature_dim` = 1024 * 64 and
  # materializes `[B, 1024, 64]`, about 3.2 GB at 12,288, which is what ran
  # physics out of memory in `wp_cuda_graph_launch` for direct-affine-phi
  # (jobs 5697131 at 20,480 and 5698695 at 16,384). This arm is CONCAT: its
  # largest phi intermediate is `[B, 2048]`, about 168 MB at 20,480, so the
  # affine OOM precedent does not bind here. The phi path is no-grad
  # (`sample_for_step` and `_encode_current_macro_batch` are both
  # @torch.no_grad), so the cost is peak allocator pressure per step, not a
  # retained graph.
  train_num_envs: 20480
  rollout_steps: 24
  frame_cap: 10000000000
  frames_per_batch: ${mul:${vars.train_num_envs},${vars.rollout_steps}}
  max_iterations: ${ceil_div:${vars.frame_cap},${vars.frames_per_batch}}

  ref_arrays: /storage/ice-shared/vip-vwt/g1-imitation/datasets/bones_seed_full/ref_arrays/g1_bones_seed_sonic_full_129785_e714bbff_v1
  persist_id: bones_seed_sonic_full_129785@e714bbff
  output_root: /data/critic_no_latent_10b/${vars.arm}_seed${vars.seed}

  # THE VARIABLE. Empty on the control; the `nolatent` arm overrides it.
  critic_args: []

  pretrain_args:
    - --task
    - ${vars.task}
    - --num_envs
    - "16"
    - --seed
    - ${vars.seed}
    - --device
    - cuda:0
    - --headless
    - --assert-kitless
    - --output_dir
    - ${vars.output_root}/encoder
    - --logger_backend
    - wandb
    - --wandb_project
    - g1-bs-pareto
    - --wandb_group
    - critic-no-latent
    - --wandb_run_name
    - ${vars.wandb_arm}-pretrain-s${vars.seed}
    - --horizon_steps
    - "10"
    - --encoder_window_mode
    - intermediate
    - --transition_objective
    - jepa_ntp
    - --jepa_loss
    - sigreg_ebm
    - --jepa_ntp_head
    - diff_chunk
    - --jepa_ntp_chunk_span
    - boundary_next
    - --jepa_endpoint_coeff
    - "0"
    - --diffsr_phi_parameterization
    - concat
    - --source_history_steps
    - "5"
    - --source_anchor
    - current
    - --latent_mode
    - deterministic
    - --z_dim
    - ${vars.z_dim}
    - --encoder_layer_norm
    - --encoder_hidden_dims
    - "2048"
    - "1024"
    - "512"
    - "512"
    - --encoder_activation
    - silu
    - --diffsr_feature_dim
    - ${vars.feature_dim}
    - --diffsr_embed_dim
    - "1024"
    - --diffsr_g_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --diffsr_mu_hidden_dims
    - "1024"
    - "1024"
    - "512"
    - --batch_size
    - ${vars.pretrain_batch_size}
    - --num_updates
    - ${vars.pretrain_updates}
    - --log_interval
    - "1000"
    - --eval_batches
    - "4"

  optim_args:
    - agent.optim.weight_decay=1.0e-2
    - agent.ipmd.critic_lr_schedule=linear
    - agent.ipmd.critic_lr_final=1.0e-5

  # FIVE-step proprio history on the ACTOR only (user, 2026-09-06); the critic
  # is single-frame by construction on this surface.
  history_args:
    - env.observations.policy.projected_gravity.history_length=5
    - env.observations.policy.base_ang_vel.history_length=5
    - env.observations.policy.joint_pos_rel.history_length=5
    - env.observations.policy.joint_vel_rel.history_length=5
    - env.observations.policy.last_action.history_length=5

  reward_args:
    - env.rewards.motion_ee_pos.weight=1.0
    - env.rewards.motion_global_anchor_pos_wide.weight=1.0
    - env.rewards.action_rate_l2.weight=-0.03

  # The 10B convention, as in direct-affine-phi: no reset ramp, so the reset
  # mix is not a second variable against that arm.
  select_args:
    - env.command_interface.reference.selection=random80_adaptive20
    - env.enable_termination_curriculum=true
    - env.termination_curriculum_start_frames=5000000
    - env.termination_curriculum_end_frames=30000000

  lowlevel_head:
    - --task
    - ${vars.task}
    - --algo
    - IPMD
    - --agent
    - ${vars.agent_entry}
    - --num_envs
    - ${vars.train_num_envs}
    - --seed
    - ${vars.seed}
    - --headless
    - --assert-kitless
    - --max_iterations
    - ${vars.max_iterations}
    - agent.logger.log_dir=${vars.output_root}/tracker
    - agent.logger.backend=wandb
    - agent.logger.video=false
    - agent.logger.project_name=g1-bs-pareto
    - agent.logger.group_name=critic-no-latent
    - env.command_interface.actor=latent
    - env.command_interface.actor.dim=${vars.command_dim}
    - env.command_interface.encoder=single
    - agent.ipmd.latent_dim=${vars.command_dim}
    - agent.ipmd.command_source=hl_skill
    - agent.ipmd.hl_skill_checkpoint_path=${vars.encoder_ckpt}
    - agent.ipmd.hl_skill_horizon_steps=10
    - agent.ipmd.hl_skill_command_mode=${vars.command_mode}
    - agent.ipmd.hl_skill_finetune_enabled=false
    - agent.ipmd.latent_steps_min=${vars.hold}
    - agent.ipmd.latent_steps_max=${vars.hold}
    - agent.ipmd.latent_learning.code_period=${vars.hold}
    - agent.ipmd.latent_learning.command_phase_mode=${vars.phase_mode}
    - agent.ipmd.latent_learning.code_latent_dim=${vars.code_latent_dim}

  tuned_core:
    - env.rewards.tracking_reward_points.weight=4.0
    - env.data.reference_prefetch_mode=next

  lowlevel_tail:
    - agent.collector.frames_per_batch=${vars.rollout_steps}
    - agent.ipmd.expert_batch_size=24576
    - agent.loss.gamma=0.97
    - agent.save_interval=500000000
    - env.sim.physics.solver_cfg.njmax=320
    - env.sim.physics.solver_cfg.nconmax=200
    - agent.policy.num_cells=[2048,2048,1024,1024,512,512]
    - agent.value_function.num_cells=[2048,2048,1024,1024,512,512]
    - agent.policy.activation_fn=silu
    - agent.value_function.activation_fn=silu

  data_overrides:
    - physics=newton_mjwarp
    - env.data.manifest=null
    - env.data.reference_arrays_dir=${vars.ref_arrays}
    - env.data.persist_id=${vars.persist_id}
    - env.data.reference_arrays_resident=true
    - env.data.reference_arrays_warm_workers=16
    - env.data.runtime_cache_device=cpu
    - env.data.macro_cache_device=cuda:0
    - env.data.runtime_cache_body_names=[pelvis,left_hip_roll_link,left_knee_link,left_ankle_roll_link,right_hip_roll_link,right_knee_link,right_ankle_roll_link,torso_link,left_shoulder_roll_link,left_elbow_link,left_wrist_yaw_link,right_shoulder_roll_link,right_elbow_link,right_wrist_yaw_link]
    # These three live in `data_overrides`, NOT in a separate block, because
    # the PRETRAIN stage takes `data_overrides` too. Keeping them apart is what
    # killed jobs 5713224/5713225: the encoder trained under the env default
    # `robot` anchor while the tracker asked for `robot_heading`, and the
    # binding check refused it -- "Skill encoder macro-window anchor mode does
    # not match the environment". 2026-08-30-past-chunk-affine-64d and
    # 2026-09-04-direct-affine-phi both carry them inside `data_overrides`.
    - env.expert_macro_state_terms=${vars.macro_terms}
    - env.expert_macro_frame_stride=${vars.stride}
    - env.expert_macro_anchor_mode=${vars.anchor_mode}

  seg1_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}

  seg2_args:
    - agent.logger.exp_name=${vars.wandb_arm}-s${vars.seed}
    - --checkpoint
    - ${vars.output_root}/tracker

shared_env:
  CLUSTER_SIM_BACKEND: newton

preflight:
  require_container_paths:
    - ${vars.ref_arrays}
  output_container_path: ${vars.output_root}

arms:
  ctrl:
    vars:
      wandb_id: cnl-ctrl
    stages: &chain
      - name: pretrain
        executable: scripts/rlopt/train_hl_skill_diffsr.py
        args: ${concat:${vars.pretrain_args},${vars.data_overrides}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0,atl1-1-03-014-16-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: g1,bones-seed,phi64,concat,past5,layernorm,seed${vars.seed},pretrain
      - name: lowlevel1
        depends_on: pretrain
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.history_args},${vars.critic_args},${vars.select_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg1_args}}
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0,atl1-1-03-014-16-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,critic-no-latent,${vars.arm},seed${vars.seed},lowlevel1
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow
      - name: lowlevel2
        executable: scripts/rlopt/train.py
        args: ${concat:${vars.lowlevel_head},${vars.tuned_core},${vars.reward_args},${vars.optim_args},${vars.history_args},${vars.critic_args},${vars.select_args},${vars.lowlevel_tail},${vars.data_overrides},${vars.seg2_args}}
        depends_on: lowlevel1
        dependency_kind: afterany
        time_limit: "15:59:00"
        gres: gpu:h200:1
        partition: coe-gpu
        qos: coe-ice
        exclude: atl1-1-03-017-30-0,atl1-1-03-018-2-0,atl1-1-03-014-16-0
        cpus_per_task: 16
        mem: 160G
        env:
          CLUSTER_WANDB_TAGS: bones-seed,129785,critic-no-latent,${vars.arm},seed${vars.seed},lowlevel2
          WANDB_RUN_ID: ${vars.wandb_id}-s${vars.seed}
          WANDB_RESUME: allow

  nolatent:
    vars:
      wandb_id: cnl-nolat
      # THE ONE CHANGE. `critic_command_terms` keeps `latent_command` only
      # while "actor" is in critic_channels, so dropping the actor channel
      # removes the latent from the critic and leaves the three reference
      # terms (command_interface.py:353-362). The policy group is untouched.
      critic_args:
        - env.command_interface.critic_channels=[reference]
    stages: *chain
