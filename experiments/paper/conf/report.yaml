# Curated results page. Implementation: imitation_experiments.reporting.
#
# Every `run` below is a directory under `logs/` holding a `summary.json`. The
# builder fails if one is missing, so a stale entry is a build error rather than
# a table that quietly lost a row. Archived runs resolve through the symlinks
# left in `logs/` when their artifacts moved to the HDD pool.
#
# Attributes carry what the artifact does not record. Temporal ensembling used to
# be the clearest case: before 2026-08-16 it survived only in the evaluation
# label, so it had to be declared here. The evaluation now writes it, its decay,
# the ODE-step count, the samples per publication, and the consumed slot count
# into `metadata.gr00t_planner`, and the renderer prefers the artifact over
# anything declared here. Every run below predates that change, so the `ensemble`
# attributes still carry it; drop them as each arm is re-evaluated. Attributes
# the evaluation genuinely cannot know, such as training row counts, stay here
# permanently.

meta:
  title: "Causal Interface — Results"
  subtitle: >-
    Does a learned latent skill command beat the explicit action chunk that
    current humanoid VLA systems publish? Every number here is reduced from an
    evaluation summary.json under the same episode-mean, root-relative MPJPE,
    with fall-only survival.
  updated: "2026-08-16"
  logs_root: logs
  noise_band_pct: 15.0

