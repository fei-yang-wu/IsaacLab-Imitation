  - temporal_ensembling

caveats:
  - >-
    Single seed per arm. Measured run-to-run MPJPE spread on this rig is
    0.2-6.4%, and Isaac evaluation is not deterministic, so any relative
    difference under about 15% is directional and is marked unresolved.
  - >-
    The headline MPJPE is the episode mean of the root-relative per-joint error.
    The same artifact also stores a transition-weighted and a successful-only
    reduction, which read several millimetres apart; open any row's provenance
    to see all three before quoting a number elsewhere.
  - >-
    An oracle ceiling is scored on the arm's own motion set and under the arm's
    own reduction. The "ceiling, own full set" line in the provenance shows what
    the same run reads over all its motions, which is usually worse.
  - >-
    The latent-bottleneck-10b rows are mid-flight segments of a 10B-frame
    campaign, not converged results. They can only be superseded.
  - >-
    Every planner row here was evaluated before 2026-08-16, when the evaluation
    began recording its inference knobs (ensembling and decay, ODE steps,
    samples per publication, consumed slots) into the summary. Their provenance
    disclosures say "inference knobs NOT RECORDED", and the ensembling shown on
    those rows comes from this spec. Re-evaluated arms read theirs from the
    artifact.
  - >-
    The released SONIC v1.1 planner comparison is NOT on this page. Its
    evaluation summaries carry no per-episode tracking metrics, so it cannot be
    reduced the same way as everything else; adding it needs a re-run that
    writes them.
