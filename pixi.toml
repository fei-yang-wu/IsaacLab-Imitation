[workspace]
authors = ["Feiyang Wu <feiyangwu@gatech.edu>"]
channels = ["conda-forge"]
name = "IsaacLab-Imitation"
platforms = ["linux-64"]
requires-pixi = ">=0.40"
version = "0.1.0"

[tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "ty check"
check = { depends-on = ["lint", "format-check", "typecheck"] }
test-rlopt = { cmd = "pytest tests/test_ipmd_components.py tests/test_ipmd_l2t.py tests/test_offline_dataset.py tests/test_gail_amp_ase_components.py tests/test_skill_commander.py tests/test_hl_skill_encoder.py tests/test_hl_skill_jepa.py tests/test_hl_skill_recon_phase.py -o 'filterwarnings=ignore:Creating VanillaWeightUpdater.*:DeprecationWarning'", cwd = "RLOpt" }
test-runtime-bootstrap = "pytest -q source/isaaclab_imitation/tests/test_rlopt_runtime_bootstrap.py"
test-experiments = "pytest -q source/imitation_experiments/tests"
test-scripts = "pytest -q scripts/audit/test_audit_bones_seed_phase5.py scripts/audit/test_compare_bones_seed_exports.py scripts/data/test_prepare_bones_seed_phase5.py scripts/rlopt/test_resolve_checkpoint_path.py"
test-default = { depends-on = ["test-rlopt", "test-runtime-bootstrap", "test-experiments", "test-scripts"] }

[dependencies]
python = "3.12.*"
cmake = "*"
cxx-compiler = "*"
git = "*"
gh = "*"
filelock = "==3.25.2"
make = "*"
ninja = "*"
packaging = "==26.0"
pre-commit = "*"
pytest = "*"
pyyaml = "==6.0.3"
ruff = "*"
setuptools = "<82"
toml = "*"
typing-extensions = "==4.12.2"
wheel = "*"

[pypi-dependencies]
# NOTE: Isaac Lab 3.0 officially documents cu128 for linux x86_64; cu130 is an
# ad hoc override for cluster hardware whose driver stack only ships CUDA 13.
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cu130" }
tensordict = "==0.11.0"
torchrl = "==0.11.1"
wandb = "==0.25.0"
# Matches the gr00t/isaaclab pins; the default env runs the async planner
# service protocol tests.
pyzmq = "==27.0.1"
pyrefly = "*"
huggingface-hub = "*"
rlopt = { path = "./RLOpt", editable = true }
iltools = { path = "./ImitationLearningTools", editable = true }
imitation-experiments = { path = "./source/imitation_experiments", editable = true }
sentence-transformers = ">=5.5.1, <6"
ty = ">=0.0.65, <0.0.66"

[feature.isaaclab.pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]
index-strategy = "unsafe-best-match"

[feature.isaaclab.system-requirements]
libc = { family = "glibc", version = "2.35" }

[feature.isaaclab.dependencies]
libxml2 = "<2.14"

[feature.isaaclab.pypi-dependencies]
isaaclab = { version = "==3.0.0b2.post1", extras = [
    "isaacsim",
    "all",
], index = "https://pypi.nvidia.com" }
# transitive pre-release pin of isaacsim-core 6.0.1.0; uv only accepts pre-releases requested explicitly
tinyobjloader = "==2.0.0rc13"
isaaclab_imitation = { path = "./source/isaaclab_imitation", editable = true }
imitation-experiments = { path = "./source/imitation_experiments", editable = true }
# Minimal extras so the Isaac-GR00T action head (external/Isaac-GR00T on
# explicit sys.path in the adapter) imports for closed-loop inference.
# torchcodec / flash-attn / deepspeed are NOT needed: they sit outside the
# head's import chain (torchcodec only in gr00t/utils/video_utils.py).
tyro = "*"
dm-tree = "*"
albumentations = "==1.4.18"
# Async planner-service client (D1): zmq transport between the Isaac
# evaluator and the gr00t-env batch service. Wire format is JSON header +
# raw float32 bytes, so no torch version coupling crosses the socket.
pyzmq = "==27.0.1"
opencv-python-headless = "*"

[feature.isaaclab.tasks]
test-isaaclab = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES pytest source/isaaclab_imitation/tests/test_g1_task_layout_contract.py source/isaaclab_imitation/tests/test_causal_planner_observation.py source/isaaclab_imitation/tests/test_planner_publish_schedule.py source/isaaclab_imitation/tests/test_g1_backend_joint_contract.py source/isaaclab_imitation/tests/test_g1_metrics_contract.py source/isaaclab_imitation/tests/test_command_interface_cfg.py source/isaaclab_imitation/tests/test_termination_window.py source/isaaclab_imitation/tests/test_heading_quat.py source/isaaclab_imitation/tests/test_expert_heading_anchor.py source/isaaclab_imitation/tests/test_tuned_fullbatch_config.py"
zero-agent = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES python scripts/zero_agent.py --task Isaac-Imitation-G1-LafanTrack-v0"
smoke-ipmd = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 HYDRA_FULL_ERROR=1 TORCHDYNAMO_DISABLE=1 python scripts/rlopt/train_physx.py --task Isaac-Imitation-G1-v2 --algo IPMD --num_envs 16 --max_iterations 1 --headless --kit_args=--/app/extensions/fsWatcherEnabled=false env.data.manifest=./data/unitree/manifests/g1_unitree_dance102_manifest.json agent.logger.backend= agent.ipmd.command_source=posterior"
smoke-future-cvae = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 HYDRA_FULL_ERROR=1 TORCHDYNAMO_DISABLE=1 python scripts/rlopt/train_physx.py --task Isaac-Imitation-G1-CVAE-v0 --algo IPMD --num_envs 4 --max_iterations 1 --headless --kit_args=--/app/extensions/fsWatcherEnabled=false env.data.manifest=./data/unitree/manifests/g1_unitree_dance102_manifest.json agent.logger.backend= agent.ipmd.command_source=posterior"
smoke-per-step-vq = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 HYDRA_FULL_ERROR=1 TORCHDYNAMO_DISABLE=1 python scripts/rlopt/train_physx.py --task Isaac-Imitation-G1-PerStepVQ-v0 --algo IPMD --num_envs 4 --max_iterations 1 --headless --kit_args=--/app/extensions/fsWatcherEnabled=false env.data.manifest=./data/unitree/manifests/g1_unitree_dance102_manifest.json agent.logger.backend= agent.ipmd.command_source=posterior"
smoke-causal-planner = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 python -m imitation_experiments.evaluation.smoke_test_causal_planner_env --headless --kit_args=--/app/extensions/fsWatcherEnabled=false --task Isaac-Imitation-G1-v2 --num_envs 4 --motion_manifest=./data/unitree/manifests/g1_unitree_dance102_manifest.json"
hl-skill-pipeline = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 HYDRA_FULL_ERROR=1 TORCHDYNAMO_DISABLE=1 python scripts/rlopt/train_hl_skill_pipeline.py"
# Routine physics-backend checks: 1-iteration vanilla PPO smokes per backend, plus
# the throughput benchmark driver (quick = a few iterations; full ~10M frames/backend).
smoke-vanilla-physx = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 HYDRA_FULL_ERROR=1 TORCHDYNAMO_DISABLE=1 python scripts/rlopt/train_physx.py --task Isaac-Imitation-G1-v0 --algo PPO --num_envs 16 --max_iterations 1 --headless --kit_args=--/app/extensions/fsWatcherEnabled=false env.lafan1_manifest_path=./data/unitree/manifests/g1_unitree_dance102_manifest.json agent.logger.backend= physics=physx"
smoke-vanilla-newton = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 HYDRA_FULL_ERROR=1 TORCHDYNAMO_DISABLE=1 python scripts/rlopt/train.py --task Isaac-Imitation-G1-v0 --algo PPO --num_envs 16 --max_iterations 1 --headless --assert-kitless --kit_args=--/app/extensions/fsWatcherEnabled=false env.lafan1_manifest_path=./data/unitree/manifests/g1_unitree_dance102_manifest.json agent.logger.backend= physics=newton_mjwarp"
bench-backends-quick = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 HYDRA_FULL_ERROR=1 TORCHDYNAMO_DISABLE=1 python scripts/bench/benchmark_physics_backends.py --num_envs 1024 --iterations 5"
bench-backends = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 HYDRA_FULL_ERROR=1 TORCHDYNAMO_DISABLE=1 python scripts/bench/benchmark_physics_backends.py"
bench-renderers = "env TERM=xterm OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1 python scripts/bench/benchmark_renderers.py"

[feature.lerobot.pypi-dependencies]
datasets = "*"

# ONNX export and CPU parity checks are isolated from Isaac Sim. Adding ONNX
# to the default feature forces Pixi to re-resolve Isaac Sim's strict NumPy
# pins even though export does not import Isaac.
[feature.onnx-export.dependencies]
onnx = ">=1.17,<2"
onnxruntime = { version = ">=1.26,<2", build = "*_cpu" }
protobuf = ">=5.29,<7"

[feature.onnx-export.tasks]
test-onnx-export = "pytest -q source/imitation_experiments/tests/test_export_policy_bundle.py"

# Isolated environment for the Isaac-GR00T submodule (planner action-head work).
# GR00T pins its own torch (2.9.0/cu128) and transformers (4.57.3), which
# conflict with both the default env (torch 2.11/cu130) and the isaaclab env,
# so this environment excludes the default feature entirely.
#
# The `gr00t` package is NOT pip-installed: its pyproject hard-requires
# deepspeed (sdist-only, torch-importing setup.py — unbuildable under uv's
# prepare-first model) and tensorrt, neither of which our use of the code
# (backbone feature caching + action-head training with our own loop) touches.
# Instead the submodule is put on PYTHONPATH via activation, and the runtime
# dependencies below pin exactly the versions from
# external/Isaac-GR00T/pyproject.toml.
[feature.gr00t.dependencies]
python = "3.12.*"
pytest = "*"
git = "*"

[feature.gr00t.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/external/Isaac-GR00T"

[feature.gr00t.pypi-dependencies]
# Pins copied from Isaac-GR00T/pyproject.toml @ 376ba890.
torch = { version = "==2.9.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.24.0", index = "https://download.pytorch.org/whl/cu128" }
transformers = "==4.57.3"
diffusers = "==0.35.1"
numpy = "==1.26.4"
einops = "==0.8.1"
pandas = "==2.2.3"
scipy = "==1.15.3"
opencv-python-headless = ">=4.5,<4.13"
albumentations = "==1.4.18"
tyro = "==0.9.17"
omegaconf = "==2.3.0"
hydra-core = "==1.3.2"
peft = "==0.17.1"
torchcodec = "==0.8.0"
wandb = "==0.23.0"
dm-tree = "*"
huggingface-hub = { version = "*", extras = ["cli"] }
tqdm = "*"
# Upstream pin (Isaac-GR00T pyproject); serves the D1 batch chunk service.
pyzmq = "==27.0.1"
imitation-experiments = { path = "./source/imitation_experiments", editable = true }
# Direct wheel URL (cp312/cu12/torch2.9) mirrored from Isaac-GR00T's
# [tool.uv.sources]; avoids a source build.
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[feature.gr00t.tasks]
test-gr00t-import = "python -c \"from gr00t.model.gr00t_n1d7.gr00t_n1d7 import Gr00tN1d7ActionHead; from gr00t.configs.model.gr00t_n1d7 import Gr00tN1d7Config; from gr00t.model.modules.dit import DiT; print('gr00t head import: OK')\""
smoke-gr00t-train = "python -m imitation_experiments.planner.train_gr00t_head output_dir=outputs/gr00t_head_smoke preset=debug data.synthetic_rows=256 optim.num_updates=20 optim.batch_size=16 run.log_interval=5 run.checkpoint_interval=20 wandb.enabled=false"
test-gr00t = "pytest -q source/imitation_experiments/tests/test_gr00t_head.py"

[feature.static.dependencies]
python = "3.12.*"
ruff = "==0.12.12"

[feature.static.tasks]
lint-owned = "ruff check source/isaaclab_imitation docker --exclude source/isaaclab_imitation/test_reference_patch_env.py --ignore F403"
compile-owned = "python -m compileall -q docker source/isaaclab_imitation/isaaclab_imitation"
ci-static = { depends-on = ["lint-owned", "compile-owned"] }

[environments]
isaaclab = ["isaaclab"]
lerobot = ["lerobot"]
onnx-export = ["onnx-export"]
isaaclab-lerobot = ["isaaclab", "lerobot"]
static = { features = ["static"], no-default-feature = true }
gr00t = { features = ["gr00t"], no-default-feature = true }
